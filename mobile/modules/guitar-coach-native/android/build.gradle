plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.guitarcoachnative'
version = '0.3.0'

android {
  namespace "expo.modules.guitarcoachnative"
  defaultConfig {
    versionCode 3
    versionName '0.3.0'
  }
}

def handModelDir = file("$projectDir/src/main/assets")
def handModelFile = file("$handModelDir/hand_landmarker.task")
def handModelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task'

tasks.register('downloadHandLandmarkerModel') {
  outputs.file(handModelFile)
  doLast {
    handModelDir.mkdirs()
    if (!handModelFile.exists() || handModelFile.length() < 1_000_000L) {
      logger.lifecycle('Downloading official MediaPipe Hand Landmarker model...')
      new URL(handModelUrl).withInputStream { input ->
        handModelFile.withOutputStream { output -> output << input }
      }
    }
  }
}

afterEvaluate {
  tasks.named('preBuild').configure {
    dependsOn(tasks.named('downloadHandLandmarkerModel'))
  }
}

dependencies {
  implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
  implementation 'com.google.mediapipe:tasks-vision:latest.release'

  def cameraxVersion = '1.4.2'
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
}
