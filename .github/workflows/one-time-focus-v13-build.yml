name: One-time validated focus mode v13 APK

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-time-focus-v13-build.yml

permissions:
  contents: write

jobs:
  validate-and-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fix real focus camera cadence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mobile/components/SessionCoachCamera.tsx')
          text = path.read_text()
          old = 'schedule(Math.max(220, targetInterval - (Date.now() - startedAt)));'
          new = 'schedule(Math.max(45, targetInterval - (Date.now() - startedAt)));'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'camera cadence replacement expected 1 match, found {count}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/one-time-focus-v13-build.yml').unlink()
          PY

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Type-check and run all quality tests
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build and verify ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

          build_tools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          tools="$ANDROID_HOME/build-tools/$build_tools"
          release_dir='app/build/outputs/apk/release'
          mkdir -p app/build/outputs/apk/compact
          output='app/build/outputs/apk/compact/guitar-coach-ai-focus-v13.apk'

          signed=$(find "$release_dir" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -n 1 || true)
          unsigned=$(find "$release_dir" -maxdepth 1 -type f -name '*unsigned.apk' | head -n 1 || true)

          if [ -n "$signed" ]; then
            cp "$signed" "$output"
          elif [ -n "$unsigned" ]; then
            "$tools/zipalign" -f 4 "$unsigned" /tmp/guitar-coach-ai-focus-v13-aligned.apk
            "$tools/apksigner" sign \
              --ks app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$output" \
              /tmp/guitar-coach-ai-focus-v13-aligned.apk
          else
            echo 'Release APK was not generated.'
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi

          "$tools/apksigner" verify --verbose "$output"
          size=$(stat -c%s "$output")
          echo "Validated focus APK size: $size bytes"
          test "$size" -gt 1000000
          test "$size" -lt 80000000

      - uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-ai-focus-v13-apk
          path: mobile/android/app/build/outputs/apk/compact/guitar-coach-ai-focus-v13.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit validated cadence fix
        run: |
          git config user.name guitar-coach-focus-bot
          git config user.email guitar-coach-focus-bot@users.noreply.github.com
          git add mobile/components/SessionCoachCamera.tsx .github/workflows/one-time-focus-v13-build.yml
          git diff --cached --check
          git commit -m "Align focus camera cadence with motion analysis"
          git push origin HEAD:agent/live-coach-compat-v055
