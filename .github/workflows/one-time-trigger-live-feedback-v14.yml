name: One-time trigger live feedback v14

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - .github/workflows/one-time-trigger-live-feedback-v14.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0
          persist-credentials: true
      - name: Register and trigger validation workflow
        run: |
          printf '\n# registered trigger\n' >> .github/workflows/one-time-live-feedback-song-coach-v14.yml
          rm -f .github/workflows/one-time-trigger-live-feedback-v14.yml
          git config user.name 'guitar-coach-ci'
          git config user.email 'guitar-coach-ci@users.noreply.github.com'
          git add .github/workflows/one-time-live-feedback-song-coach-v14.yml .github/workflows/one-time-trigger-live-feedback-v14.yml
          git commit -m 'Trigger live feedback and song coach validation'
          git push origin HEAD:agent/live-coach-compat-v055
