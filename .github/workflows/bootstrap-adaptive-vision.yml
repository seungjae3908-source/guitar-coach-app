name: Bootstrap adaptive guitar vision

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - .github/workflows/bootstrap-adaptive-vision.yml

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'chore(adaptive): install generated files'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0
      - name: Install adaptive vision sources
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/adaptive-bundle.b64 <<'B64A'

B64A
          cat >> /tmp/adaptive-bundle.b64 <<'B64B'

B64B
          cat >> /tmp/adaptive-bundle.b64 <<'B64C'

B64C
          cat >> /tmp/adaptive-bundle.b64 <<'B64D'

B64D
          cat >> /tmp/adaptive-bundle.b64 <<'B64E'

B64E
          base64 --decode /tmp/adaptive-bundle.b64 > /tmp/adaptive-bundle.tar.gz
          echo '47a669e3a02f2cc3b1c74f9641c37594847dd9a9b0722960bd9b584b7e298c97  /tmp/adaptive-bundle.tar.gz' | sha256sum --check
          tar -xzf /tmp/adaptive-bundle.tar.gz
          npm --prefix web install
          npm --prefix web test
          npm --prefix web run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/adaptive-guitar-vision.js web/src/adaptive-guitar-vision.test.mjs web/src/AdaptiveDebugCenter.jsx web/src/AppSafe.jsx web/package.json web/package-lock.json
          git commit -m 'feat(vision): adaptive full and partial guitar pose'
          git push origin HEAD:agent/live-coach-compat-v055
