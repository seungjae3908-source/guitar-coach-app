name: Build front camera preview APK

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - mobile/**
      - .github/workflows/front-camera-preview-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android native project
        working-directory: mobile
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build and verify ARM64 test APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

          build_tools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          tools="$ANDROID_HOME/build-tools/$build_tools"
          release_dir='app/build/outputs/apk/release'
          output='app/build/outputs/apk/guitar-coach-front-camera.apk'

          signed=$(find "$release_dir" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -n 1 || true)
          unsigned=$(find "$release_dir" -maxdepth 1 -type f -name '*unsigned.apk' | head -n 1 || true)

          if [ -n "$signed" ]; then
            cp "$signed" "$output"
          elif [ -n "$unsigned" ]; then
            "$tools/zipalign" -f 4 "$unsigned" /tmp/guitar-coach-front-camera-aligned.apk
            "$tools/apksigner" sign \
              --ks app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$output" \
              /tmp/guitar-coach-front-camera-aligned.apk
          else
            echo 'Release APK was not generated.'
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi

          "$tools/apksigner" verify --verbose "$output"
          size=$(stat -c%s "$output")
          echo "Front camera APK size: $size bytes"
          test "$size" -gt 1000000
          test "$size" -lt 120000000

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-front-camera-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/guitar-coach-front-camera.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="front-camera-${short_sha}"
          apk='mobile/android/app/build/outputs/apk/guitar-coach-front-camera.apk'
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Front camera test ${short_sha}" \
            --notes "Galaxy S26 and Galaxy Tab S10 FE front-camera test APK. Test package only; stable 0.5.4 is unchanged." \
            --prerelease
