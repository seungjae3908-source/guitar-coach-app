name: Harden camera navigation scroll and song studio runtime

on:
  push:
    branches:
      - agent/live-coach-compat-v055

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'guitar-coach-quality-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply guarded runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, expected: int, label: str) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old, new)

          # 1) Use continuous CameraX for both hands, keep preview alive before Start,
          # and provide an explicit remount path after camera errors.
          path = Path('mobile/components/SessionCoachCamera.tsx')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(
              text,
              "  const useContinuousRightHand = activeMode === 'right-hand' && isContinuousRightHandCameraAvailable;",
              "  const useContinuousHand = activeMode !== 'full' && isContinuousRightHandCameraAvailable;\n  const useContinuousRightHand = activeMode === 'right-hand' && useContinuousHand;",
              1,
              'continuous hand declaration',
          )
          text = replace_exact(text, '    if (useContinuousRightHand) return;', '    if (useContinuousHand) return;', 2, 'continuous hand guards')
          text = replace_exact(
              text,
              '  }, [activeMode, cameraReady, facing, permission?.granted, running, useContinuousRightHand]);',
              '  }, [activeMode, cameraReady, facing, permission?.granted, running, useContinuousHand]);',
              1,
              'camera effect dependencies',
          )
          text = replace_exact(
              text,
              "  const onLayout = (event: LayoutChangeEvent) => setPreviewSize({ width: event.nativeEvent.layout.width, height: event.nativeEvent.layout.height });",
              "  const retryCamera = () => {\n    setAnalysisError('');\n    setCameraReady(false);\n    setCameraKey((value) => value + 1);\n  };\n  const onLayout = (event: LayoutChangeEvent) => setPreviewSize({ width: event.nativeEvent.layout.width, height: event.nativeEvent.layout.height });",
              1,
              'camera retry function',
          )
          text = replace_exact(
              text,
              "<Text style={styles.eyebrow}>{useContinuousRightHand ? 'CONTINUOUS CAMERAX AI' : 'ADAPTIVE CAMERA AI'}</Text>",
              "<Text style={styles.eyebrow}>{useContinuousHand ? 'CONTINUOUS CAMERAX AI' : 'ADAPTIVE CAMERA AI'}</Text>",
              1,
              'camera engine badge',
          )
          text = replace_exact(
              text,
              "        {useContinuousRightHand ? (\n          <View style={styles.fixedCameraBadge}><Text style={styles.fixedCameraText}>후면 연속</Text></View>",
              "        {useContinuousHand ? (\n          <View style={styles.fixedCameraBadge}><Text style={styles.fixedCameraText}>후면 연속</Text></View>",
              1,
              'fixed camera badge',
          )
          text = replace_exact(
              text,
              "        {useContinuousRightHand ? (\n          <ContinuousRightHandCamera\n            style={StyleSheet.absoluteFill}\n            running\n            pickColor=\"auto\"",
              "        {useContinuousHand ? (\n          <ContinuousRightHandCamera\n            key={`continuous-${activeMode}-${cameraKey}`}\n            style={StyleSheet.absoluteFill}\n            running={true}\n            pickColor={activeMode === 'right-hand' ? 'auto' : 'none'}",
              1,
              'continuous camera view',
          )
          text = replace_exact(
              text,
              "            onError={(event) => setAnalysisError(event.nativeEvent.message)}",
              "            onError={(event) => {\n              setCameraReady(false);\n              setAnalysisError(event.nativeEvent.message);\n            }}",
              1,
              'continuous camera error',
          )
          text = replace_exact(
              text,
              'onMountError={(event) => setAnalysisError(event.message)}',
              "onMountError={(event) => { setCameraReady(false); setAnalysisError(event.message); }}",
              1,
              'expo camera error',
          )
          text = replace_exact(text, '{useContinuousRightHand && cameraReady ? (', '{useContinuousHand && cameraReady ? (', 1, 'auto framing visibility')
          text = replace_exact(
              text,
              "{running ? `${activeMode === 'full' ? '전체' : activeMode === 'right-hand' ? '오른손' : '왼손'} ${useContinuousRightHand ? '연속 분석' : '자동 추적'}` : useContinuousRightHand ? '연속 정렬·분석 대기' : '세션 시작 대기'}",
              "{running ? `${activeMode === 'full' ? '전체' : activeMode === 'right-hand' ? '오른손' : '왼손'} ${useContinuousHand ? '연속 분석' : '자동 추적'}` : useContinuousHand ? '카메라 구도·초점 준비 중' : '세션 시작 대기'}",
              1,
              'camera state badge',
          )
          text = replace_exact(
              text,
              "        {activeMode === 'right-hand' ? <Text style={styles.fpsResult}>{continuousStatus(continuousStats)}</Text> : null}",
              "        {useContinuousHand ? <Text style={styles.fpsResult}>{continuousStatus(continuousStats)}</Text> : null}",
              1,
              'continuous camera diagnostics',
          )
          text = replace_exact(
              text,
              "        <Text style={styles.resultDetail}>{useContinuousRightHand ? '미리보기는 계속 유지하고 오래된 분석 프레임은 쌓지 않습니다. 피크와 각 손가락의 최근 궤적이 줄을 통과할 때만 탄현 후보로 기록합니다.' : '전체·왼손 모드는 현재 안정된 촬영 분석을 유지합니다.'}</Text>",
              "        <Text style={styles.resultDetail}>{useContinuousRightHand ? '미리보기는 계속 유지하고 오래된 분석 프레임은 쌓지 않습니다. 피크와 각 손가락의 최근 궤적이 줄을 통과할 때만 탄현 후보로 기록합니다.' : activeMode === 'left-hand' && useContinuousHand ? '왼손 관절을 연속 추적해 탄현 순간의 지판 좌표와 마이크 음정을 결합합니다.' : '전체 모드는 자세와 양손을 교차 수집합니다.'}</Text>",
              1,
              'left hand runtime detail',
          )
          text = replace_exact(
              text,
              "        {!isContinuousRightHandCameraAvailable && activeMode === 'right-hand' ? <Text style={styles.warningText}>연속 카메라 모듈이 없어 사진 분석으로 대체되었습니다.</Text> : null}",
              "        {!isContinuousRightHandCameraAvailable && activeMode !== 'full' ? <Text style={styles.warningText}>연속 카메라 모듈이 없어 사진 분석으로 대체되었습니다. 빠른 동작은 판정 불가가 될 수 있습니다.</Text> : null}",
              1,
              'continuous module warning',
          )
          text = replace_exact(
              text,
              "        {analysisError ? <Text style={styles.errorText}>{analysisError}</Text> : null}",
              "        {analysisError ? (\n          <View style={styles.retryRow}>\n            <Text style={styles.errorText}>{analysisError}</Text>\n            <Pressable onPress={retryCamera} style={styles.retryButton}><Text style={styles.retryButtonText}>카메라 다시 연결</Text></Pressable>\n          </View>\n        ) : null}",
              1,
              'camera retry UI',
          )
          text = replace_exact(
              text,
              "  errorText: { color: '#ff7b72', fontSize: 8, lineHeight: 12, marginTop: 4 },",
              "  retryRow: { marginTop: 7, gap: 7 },\n  retryButton: { minHeight: 38, borderRadius: 10, backgroundColor: '#da3633', alignItems: 'center', justifyContent: 'center' },\n  retryButtonText: { color: '#ffffff', fontSize: 9, fontWeight: '900' },\n  errorText: { color: '#ff7b72', fontSize: 8, lineHeight: 12, marginTop: 4 },",
              1,
              'camera retry styles',
          )
          path.write_text(text, encoding='utf-8')

          # 2) Remount every destination screen when toolbar navigation changes so
          # stale CameraView/WebView instances cannot keep the next screen blocked.
          path = Path('mobile/CompleteBetaAppV060Plus.tsx')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(
              text,
              '      <View style={styles.body}>',
              '      <View key={tool} style={styles.body}>',
              1,
              'destination remount key',
          )
          path.write_text(text, encoding='utf-8')

          # 3) Keep nested scrolling and provide a real external fallback when
          # YouTube blocks app embedding.
          path = Path('mobile/components/MasterSongStudioPanel.tsx')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(
              text,
              "  const alignSectionStart = () => {",
              "  const openCurrentVideo = async () => {\n    const url = youtubeUrl.trim();\n    if (!url) {\n      setError('먼저 YouTube 공유 URL을 입력하세요.');\n      return;\n    }\n    try {\n      const supported = await Linking.canOpenURL(url);\n      if (!supported) throw new Error('이 YouTube URL을 열 수 없습니다.');\n      await Linking.openURL(url);\n    } catch (caught) {\n      setError(caught instanceof Error ? caught.message : 'YouTube 앱을 열지 못했습니다.');\n    }\n  };\n\n  const alignSectionStart = () => {",
              1,
              'song external fallback function',
          )
          text = replace_exact(
              text,
              "    <ScrollView ref={scrollRef} style={styles.root} contentContainerStyle={styles.content} showsVerticalScrollIndicator={false}>",
              "    <ScrollView ref={scrollRef} style={styles.root} contentContainerStyle={styles.content} showsVerticalScrollIndicator nestedScrollEnabled keyboardShouldPersistTaps=\"handled\">",
              1,
              'song studio scrolling',
          )
          text = replace_exact(
              text,
              "      <View style={styles.transportCard}>",
              "      <Pressable disabled={!youtubeUrl.trim()} onPress={() => void openCurrentVideo()} style={[styles.externalPlayerButton, !youtubeUrl.trim() && styles.disabled]}>\n        <Text style={styles.externalPlayerText}>앱 재생이 막히면 YouTube에서 열기</Text>\n      </Pressable>\n\n      <View style={styles.transportCard}>",
              1,
              'song external fallback button',
          )
          text = replace_exact(
              text,
              "  transportCard: { backgroundColor: '#161b22', borderWidth: 1, borderColor: '#30363d', borderRadius: 16, padding: 11, marginTop: 9 },",
              "  externalPlayerButton: { minHeight: 42, borderRadius: 11, borderWidth: 1, borderColor: '#1f6feb', backgroundColor: '#111d2f', alignItems: 'center', justifyContent: 'center', marginTop: 8 },\n  externalPlayerText: { color: '#79c0ff', fontSize: 9, fontWeight: '900' },\n  transportCard: { backgroundColor: '#161b22', borderWidth: 1, borderColor: '#30363d', borderRadius: 16, padding: 11, marginTop: 9 },",
              1,
              'song external fallback styles',
          )
          path.write_text(text, encoding='utf-8')

          # 4) Let both calibration wizards consume the available height and scroll.
          path = Path('mobile/components/CalibrationHub.tsx')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(text, '  body: { flex: 1 },', '  body: { flex: 1, minHeight: 0 },', 1, 'calibration body scrolling')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run TypeScript and executable quality gates
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile release Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Commit verified runtime fixes
        run: |
          rm -f .github/workflows/one-time-continuous-left-hand.yml .github/continuous-left-hand-trigger.txt
          git config user.name "guitar-coach-quality-bot"
          git config user.email "guitar-coach-quality-bot@users.noreply.github.com"
          git add mobile/components/SessionCoachCamera.tsx mobile/CompleteBetaAppV060Plus.tsx mobile/components/MasterSongStudioPanel.tsx mobile/components/CalibrationHub.tsx .github/workflows/one-time-continuous-left-hand.yml .github/continuous-left-hand-trigger.txt
          git commit -m "Harden live cameras navigation scroll and song playback"
          git push origin HEAD:agent/live-coach-compat-v055
