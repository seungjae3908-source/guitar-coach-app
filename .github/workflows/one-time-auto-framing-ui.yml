name: Apply guarded auto framing UI patch

on:
  push:
    branches:
      - agent/live-coach-compat-v055

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'guitar-coach-quality-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply exact auto framing UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path('mobile/modules/guitar-coach-continuous-camera/index.tsx')
          text = wrapper.read_text(encoding='utf-8')
          old = '''  stringRefreshAgeFrames: number;
          autoZoomRatio?: number;
          autoFramingState?: 'searching' | 'zooming-in' | 'zooming-out' | 'max-zoom-too-small' | 'locked' | string;
  newHits: ContinuousStringHit[];'''
          new = '''  stringRefreshAgeFrames: number;
  autoZoomRatio?: number;
  autoFramingState?: 'searching' | 'zooming-in' | 'zooming-out' | 'max-zoom-too-small' | 'locked' | string;
  newHits: ContinuousStringHit[];'''
          if text.count(old) != 1:
              raise SystemExit(f'wrapper match count={text.count(old)}')
          wrapper.write_text(text.replace(old, new), encoding='utf-8')

          camera = Path('mobile/components/SessionCoachCamera.tsx')
          text = camera.read_text(encoding='utf-8')
          old = '''function continuousStatus(stats: ContinuousRightHandStats | null) {
  if (!stats) return '연속 분석 엔진 준비 중';
  const inputFps = stats.previewFps > 0 ? stats.previewFps.toFixed(1) : '-';
  const analysisFps = stats.analysisFps > 0 ? stats.analysisFps.toFixed(1) : '-';
  return `카메라 입력 ${inputFps}fps · 분석 출력 ${analysisFps}fps · 누적 ${stats.analyzedFrameCount}프레임`;
}'''
          new = '''function autoFramingLabel(stats: ContinuousRightHandStats | null) {
  const state = stats?.autoFramingState;
  if (state === 'zooming-in') return '자동 확대 중';
  if (state === 'zooming-out') return '자동 축소 중';
  if (state === 'max-zoom-too-small') return '최대 줌에서도 손이 작음';
  if (state === 'locked') return '손 구도 고정';
  return '손 찾는 중';
}

function continuousStatus(stats: ContinuousRightHandStats | null) {
  if (!stats) return '연속 분석 엔진 준비 중 · 손 찾는 중';
  const inputFps = stats.previewFps > 0 ? stats.previewFps.toFixed(1) : '-';
  const analysisFps = stats.analysisFps > 0 ? stats.analysisFps.toFixed(1) : '-';
  const zoom = stats.autoZoomRatio && stats.autoZoomRatio > 0 ? `${stats.autoZoomRatio.toFixed(2)}x` : '-';
  return `카메라 ${inputFps}fps · 분석 ${analysisFps}fps · 줌 ${zoom} · ${autoFramingLabel(stats)} · 누적 ${stats.analyzedFrameCount}프레임`;
}'''
          if text.count(old) != 1:
              raise SystemExit(f'continuousStatus match count={text.count(old)}')
          text = text.replace(old, new)

          old = '''        <View pointerEvents="none" style={styles.badgeRow}>
          <Text style={[styles.badge, running && styles.badgeRunning]}>{running ? `${activeMode === 'full' ? '전체' : activeMode === 'right-hand' ? '오른손' : '왼손'} ${useContinuousRightHand ? '연속 분석' : '자동 추적'}` : useContinuousRightHand ? '연속 정렬·분석 대기' : '세션 시작 대기'}</Text>
          <Text style={styles.badge}>{frameCount}프레임</Text>
        </View>'''
          new = '''        <View pointerEvents="none" style={styles.badgeRow}>
          <Text style={[styles.badge, running && styles.badgeRunning]}>{running ? `${activeMode === 'full' ? '전체' : activeMode === 'right-hand' ? '오른손' : '왼손'} ${useContinuousRightHand ? '연속 분석' : '자동 추적'}` : useContinuousRightHand ? '연속 정렬·분석 대기' : '세션 시작 대기'}</Text>
          <Text style={styles.badge}>{frameCount}프레임</Text>
        </View>
        {useContinuousRightHand && cameraReady ? (
          <View pointerEvents="none" style={styles.autoFrameBadge}>
            <Text style={styles.autoFrameBadgeText}>{autoFramingLabel(continuousStats)}{continuousStats?.autoZoomRatio ? ` · ${continuousStats.autoZoomRatio.toFixed(2)}x` : ''}</Text>
          </View>
        ) : null}'''
          if text.count(old) != 1:
              raise SystemExit(f'badge match count={text.count(old)}')
          text = text.replace(old, new)

          old = '''  badgeRunning: { backgroundColor: 'rgba(35,134,54,0.92)' },
  loading: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(0,0,0,0.64)', alignItems: 'center', justifyContent: 'center' },'''
          new = '''  badgeRunning: { backgroundColor: 'rgba(35,134,54,0.92)' },
  autoFrameBadge: { position: 'absolute', left: 8, bottom: 8, borderRadius: 10, backgroundColor: 'rgba(17,29,47,0.92)', borderWidth: 1, borderColor: '#1f6feb', paddingHorizontal: 8, paddingVertical: 5 },
  autoFrameBadgeText: { color: '#b6d8ff', fontSize: 7, fontWeight: '900' },
  loading: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(0,0,0,0.64)', alignItems: 'center', justifyContent: 'center' },'''
          if text.count(old) != 1:
              raise SystemExit(f'style match count={text.count(old)}')
          camera.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Type-check exact branch state
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-auto-framing-ui.yml
          git config user.name "guitar-coach-quality-bot"
          git config user.email "guitar-coach-quality-bot@users.noreply.github.com"
          git add mobile/modules/guitar-coach-continuous-camera/index.tsx mobile/components/SessionCoachCamera.tsx .github/workflows/one-time-auto-framing-ui.yml
          git commit -m "Show CameraX auto framing and zoom state"
          git push origin HEAD:agent/live-coach-compat-v055
