name: Build Guitar Training OS v2.10.0 BPM + Personal Score APK

on:
  push:
    branches:
      - build/guitar-training-os-v210-bpm-personal-score
    paths:
      - '.github/workflows/apk-guitar-v210.yml'
      - 'tempo-coach-v1/.patch_v210/chunks/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified v2.9.0 source baseline
        uses: actions/download-artifact@v4
        with:
          name: GuitarTempoCoach-v2.9.0-source
          path: baseline
          github-token: ${{ github.token }}
          repository: seungjae3908-source/guitar-coach-app
          run-id: 35481501028

      - name: Download verified v2.9.0 APK for update compatibility
        uses: actions/download-artifact@v4
        with:
          name: GuitarTempoCoach-v2.9.0-technique-tab-apk
          path: previous-apk
          github-token: ${{ github.token }}
          repository: seungjae3908-source/guitar-coach-app
          run-id: 35481501028

      - name: Restore verified v2.9.0 source
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && sha256sum -c GuitarTempoCoach-v2.9.0-source.zip.sha256)
          rm -rf mobile
          mkdir mobile
          unzip -q baseline/GuitarTempoCoach-v2.9.0-source.zip -d mobile
          test "$(node -p "require('./mobile/package.json').version")" = '2.9.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.9.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '17'
          test -s previous-apk/GuitarTempoCoach-v2.9.0-technique-tab-release.apk

      - name: Reassemble and verify exact v2.10.0 BPM + Personal Score patch
        shell: bash
        run: |
          set -euo pipefail
          cat tempo-coach-v1/.patch_v210/chunks/patch{00..04}.txt > /tmp/v210.b64
          test "$(wc -c < /tmp/v210.b64)" -eq 29208
          echo '25b300822f5573425e461ae4441538cd9f7572f0c228cac3a077c22ec1106932  /tmp/v210.b64' | sha256sum -c -
          base64 --decode /tmp/v210.b64 > /tmp/v210.patch.gz
          test "$(wc -c < /tmp/v210.patch.gz)" -eq 21904
          echo 'ae933ad11a439e4486bc0683341e1837fd730461205d630838bd88acc27039ce  /tmp/v210.patch.gz' | sha256sum -c -
          gzip -t /tmp/v210.patch.gz
          gzip -dc /tmp/v210.patch.gz > /tmp/v210.patch
          test "$(wc -c < /tmp/v210.patch)" -eq 95066
          echo '88e9821c5c0befc8826c0a80510248a564e94a63c3907e9f7d89b01a5fa9796d  /tmp/v210.patch' | sha256sum -c -

      - name: Apply v2.10.0 BPM + Personal Score patch
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 -d mobile < /tmp/v210.patch
          test "$(node -p "require('./mobile/package.json').version")" = '2.10.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.10.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '18'
          test "$(node -p "require('./mobile/app.json').expo.android.package")" = 'com.guitartempo.coach'

      - name: Verify v2.10.0 BPM and personal-score contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F 'ScrollView' mobile/src/screens; then
            echo 'ScrollView remains in a main screen'; exit 1
          fi
          grep -F 'GUITAR TRAINING OS 2.10.0' mobile/src/screens/HomeScreen.tsx
          grep -F 'PRACTICE OS 2.10.0' mobile/src/screens/PracticeScreen.tsx
          grep -F 'STUDIO 2.10.0' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'SONG LAB 2.10.0' mobile/src/screens/SongLabScreen.tsx
          grep -F 'BPM 설정' mobile/src/screens/PracticeScreen.tsx
          grep -F 'label="−1"' mobile/src/screens/PracticeScreen.tsx
          grep -F 'label="+1"' mobile/src/screens/PracticeScreen.tsx
          grep -F 'TAP · BPM 찾기' mobile/src/screens/PracticeScreen.tsx
          grep -F '30~260 BPM · 1 BPM 단위 조정' mobile/src/screens/PracticeScreen.tsx
          grep -F 'draft.bpm-1' mobile/src/screens/SongLabScreen.tsx
          grep -F 'draft.bpm+1' mobile/src/screens/SongLabScreen.tsx
          grep -F 'parsePersonalScorePack' mobile/src/screens/SongLabScreen.tsx
          grep -F 'GTC_SCORE_PACK_V1' mobile/src/domain/songLab.ts
          grep -F "source:'scorepack'" mobile/src/domain/songLab.ts
          grep -F 'unfoldedRepeats' mobile/src/domain/songLab.ts
          grep -F 'Personal Score Pack' mobile/src/domain/songLab.ts
          grep -F 'BPM + Personal Score Pack Acceptance' mobile/DEVICE_ACCEPTANCE_V210.md
          grep -F 'RTC-PASS' mobile/src/screens/SongLabScreen.tsx
          grep -F 'RTC-E05' mobile/DEVICE_ACCEPTANCE_V281.md

      - name: Package v2.10.0 source baseline
        shell: bash
        run: |
          set -euo pipefail
          (cd mobile && zip -qr ../GuitarTempoCoach-v2.10.0-source.zip .)
          test -s GuitarTempoCoach-v2.10.0-source.zip
          sha256sum GuitarTempoCoach-v2.10.0-source.zip > GuitarTempoCoach-v2.10.0-source.zip.sha256

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect, sign and verify v2.10.0 APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$BUILD_TOOLS"
          RELEASE_DIR='mobile/android/app/build/outputs/apk/release'
          OUTPUT='GuitarTempoCoach-v2.10.0-bpm-personal-score-release.apk'
          SIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -1 || true)"
          UNSIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*unsigned.apk' | head -1 || true)"
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUTPUT"
          elif [ -n "$UNSIGNED" ]; then
            test -s mobile/android/app/debug.keystore
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" /tmp/GuitarTempoCoach-v210-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks mobile/android/app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT" \
              /tmp/GuitarTempoCoach-v210-aligned.apk
          else
            echo 'Release APK was not generated'; exit 1
          fi
          test -s "$OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'assets/index.android.bundle'
          BUNDLE_BYTES="$(unzip -p "$OUTPUT" assets/index.android.bundle | wc -c)"
          echo "Embedded JS bundle bytes: $BUNDLE_BYTES"
          test "$BUNDLE_BYTES" -gt 10000
          unzip -t "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -lh "$OUTPUT"

      - name: Upload v2.10.0 APK before compatibility gate
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.10.0-bpm-personal-score-apk
          path: |
            GuitarTempoCoach-v2.10.0-bpm-personal-score-release.apk
            GuitarTempoCoach-v2.10.0-bpm-personal-score-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload v2.10.0 source before compatibility gate
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.10.0-source
          path: |
            GuitarTempoCoach-v2.10.0-source.zip
            GuitarTempoCoach-v2.10.0-source.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify v2.9.0 to v2.10.0 update compatibility
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          OLD_APK='previous-apk/GuitarTempoCoach-v2.9.0-technique-tab-release.apk'
          NEW_APK='GuitarTempoCoach-v2.10.0-bpm-personal-score-release.apk'
          test -s "$OLD_APK"
          test -s "$NEW_APK"

          echo '=== v2.9.0 signer certificates ==='
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OLD_APK" 2>&1 | tee /tmp/v290-certs.txt
          echo '=== v2.10.0 signer certificates ==='
          "$BUILD_TOOLS/apksigner" verify --print-certs "$NEW_APK" 2>&1 | tee /tmp/v210-certs.txt

          OLD_CERT="$(grep -i -m1 'certificate SHA-256 digest' /tmp/v290-certs.txt | sed -E 's/.*digest:[[:space:]]*//' | tr -d '\r[:space:]' || true)"
          NEW_CERT="$(grep -i -m1 'certificate SHA-256 digest' /tmp/v210-certs.txt | sed -E 's/.*digest:[[:space:]]*//' | tr -d '\r[:space:]' || true)"
          if [ -z "$OLD_CERT" ] || [ -z "$NEW_CERT" ]; then
            echo 'Unable to parse signer certificate SHA-256 digest.'
            exit 1
          fi
          echo "v2.9.0 cert SHA-256: $OLD_CERT"
          echo "v2.10.0 cert SHA-256: $NEW_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo "$OLD_CERT" > GuitarTempoCoach-v2.9.0-to-v2.10.0-signing-cert.sha256

          AAPT="$BUILD_TOOLS/aapt"
          test -x "$AAPT"
          OLD_PACKAGE="$($AAPT dump badging "$OLD_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          NEW_PACKAGE="$($AAPT dump badging "$NEW_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          OLD_CODE="$($AAPT dump badging "$OLD_APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          NEW_CODE="$($AAPT dump badging "$NEW_APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          echo "Packages: $OLD_PACKAGE -> $NEW_PACKAGE"
          echo "VersionCodes: $OLD_CODE -> $NEW_CODE"
          test "$OLD_PACKAGE" = 'com.guitartempo.coach'
          test "$NEW_PACKAGE" = "$OLD_PACKAGE"
          test "$OLD_CODE" = '17'
          test "$NEW_CODE" = '18'
          echo 'UPDATE_COMPATIBILITY=PASS'

      - name: Upload update compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.9.0-to-v2.10.0-update-compatibility
          path: GuitarTempoCoach-v2.9.0-to-v2.10.0-signing-cert.sha256
          if-no-files-found: error
          retention-days: 30
