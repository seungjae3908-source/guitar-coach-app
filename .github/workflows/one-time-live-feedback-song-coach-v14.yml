  },
  'acoustic-fast-car': {
    intro: ['C', 'G', 'Em', 'D'],
    verse: ['C', 'G', 'Em', 'D'],
    chorus: ['C', 'G', 'Em', 'D'],
    bridge: ['Em', 'D', 'C', 'G'],
