name: One-time live feedback and song posture coach v14

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - .github/workflows/one-time-live-feedback-song-coach-v14.yml

permissions:
  contents: write

jobs:
  implement-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Implement posture feedback and song coach
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def write(path: str, content: str):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

