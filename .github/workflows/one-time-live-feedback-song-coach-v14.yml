}

{
  const samples = Array.from({ length: 8 }, (_, index) => ({
    capturedAt: 1000 + index * 180,
    result: result({ leftHip: { x: 0.62, y: 0.70 }, rightHip: { x: 0.76, y: 0.70 } }),
