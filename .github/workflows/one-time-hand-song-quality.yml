name: One-time hand and song quality repair

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/live-coach-compat-v055'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - name: Inspect repair payload integrity
        shell: bash
        run: |
          set -euo pipefail
          for part in .github/hand-song-repair/part-*; do
            printf '%s bytes=' "$part"
            wc -c < "$part" | tr -d ' '\n            printf ' blob='
            git hash-object "$part"
          done
          exit 1
