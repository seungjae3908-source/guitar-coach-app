name: One-time v27 generated-output cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: one-time-v27-generated-output-cleanup
  cancel-in-progress: true

jobs:
  clean:
    if: github.event.pull_request.head.ref == 'agent/live-coach-compat-v055'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v27 branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - name: Remove generated Android output from source commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch mobile/android
          git restore --source=c7a7033ec68f557066001877389275fdc19ebce8 --staged --worktree -- mobile/modules/guitar-coach-native/android/build
          git rm -f --ignore-unmatch \
            mobile/modules/guitar-coach-native/android/src/main/assets/efficientdet_lite0.tflite \
            mobile/modules/guitar-coach-native/android/src/main/assets/efficientnet_lite0.tflite
          rm -f .github/workflows/one-time-v27-clean-generated.yml
          git config user.name "guitar-coach-v27-bot"
          git config user.email "guitar-coach-v27-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated Android outputs from v27"
          git pull --rebase origin agent/live-coach-compat-v055
          git push origin HEAD:agent/live-coach-compat-v055
