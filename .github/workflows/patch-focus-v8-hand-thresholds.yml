name: Apply Focus V8 hand detection thresholds

on:
  push:
    branches:
      - agent/live-coach-compat-v055

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - name: Lower crop-only MediaPipe thresholds
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachHandModule.kt')
          text = path.read_text()
          replacements = {
              '.setMinHandDetectionConfidence(0.52f)': '.setMinHandDetectionConfidence(0.38f)',
              '.setMinHandPresenceConfidence(0.52f)': '.setMinHandPresenceConfidence(0.38f)',
              '.setMinTrackingConfidence(0.52f)': '.setMinTrackingConfidence(0.42f)',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'missing expected threshold: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit threshold patch when needed
        run: |
          if git diff --quiet -- mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachHandModule.kt; then
            echo 'Thresholds already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachHandModule.kt
          git commit -m 'Tune Focus V8 hand detection thresholds'
          git push origin HEAD:agent/live-coach-compat-v055
