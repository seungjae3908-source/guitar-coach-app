name: Build Guitar Training OS v2.7 APK

on:
  push:
    branches:
      - build/guitar-tempo-coach-v1-apk-clean
    paths:
      - '.github/workflows/apk-guitar-v270.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified v2.6 source baseline
        uses: actions/download-artifact@v4
        with:
          name: GuitarTempoCoach-v2.6.0-source
          path: baseline
          github-token: ${{ github.token }}
          repository: seungjae3908-source/guitar-coach-app
          run-id: 35187646316

      - name: Restore verified v2.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile && mkdir mobile
          unzip -q baseline/GuitarTempoCoach-v2.6.0-source.zip -d mobile
          test "$(node -p "require('./mobile/package.json').version")" = '2.6.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.6.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '12'

      - name: Apply verified v2.7 Tone Match Wizard patch
        shell: bash
        run: |
          set -euo pipefail
          cat tempo-coach-v1/.patch_v270/patch{00..10}.txt > /tmp/v270.b64
          echo '0e27cc6dc8616edf7c14b4aa6e5f41881f5f9b1825c701676b97287c1526336e  /tmp/v270.b64' | sha256sum -c -
          base64 --decode /tmp/v270.b64 > /tmp/v270.patch.gz
          echo '5c2ca984f2d08f6240f47c7485af96bb2da2d5ee9d540d2ccca6434de78c3190  /tmp/v270.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v270.patch.gz > /tmp/v270.patch
          echo '7670eb09ecad1d6263e641e1239a9cba5f775c6a4697f712274eeef849fd07e5  /tmp/v270.patch' | sha256sum -c -
          patch -p4 -d mobile < /tmp/v270.patch

          test "$(node -p "require('./mobile/package.json').version")" = '2.7.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.7.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '13'
          if grep -R -F 'ScrollView' mobile/src/screens; then echo 'ScrollView remains in a main screen'; exit 1; fi
          grep -F 'SONG LAB 2.7' mobile/src/screens/SongLabScreen.tsx
          grep -F 'GUITAR TRAINING OS 2.7' mobile/src/screens/HomeScreen.tsx
          grep -F 'PRACTICE OS 2.7' mobile/src/screens/PracticeScreen.tsx
          grep -F 'STUDIO 2.7' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'TONE MATCH WIZARD · BOSS GT-1 + THR-II' mobile/src/screens/SongLabScreen.tsx
          grep -F 'buildToneWizard' mobile/src/domain/toneRig.ts
          grep -F 'refineToneRecipe' mobile/src/domain/toneRig.ts
          grep -F 'toneHardwareSheet' mobile/src/domain/toneRig.ts
          grep -F 'toneRefine' mobile/src/types.ts
          grep -F 'toneRefine' mobile/src/storage/appStorage.ts
          grep -F "label:'묵직+'" mobile/src/screens/SongLabScreen.tsx
          grep -F "label:'공간+'" mobile/src/screens/SongLabScreen.tsx
          grep -F 'toneWizardCompact' mobile/src/screens/SongLabScreen.tsx

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect, sign and verify v2.7 APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$BUILD_TOOLS"
          RELEASE_DIR='mobile/android/app/build/outputs/apk/release'
          OUTPUT='GuitarTempoCoach-v2.7.0-release.apk'
          SIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -1 || true)"
          UNSIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*unsigned.apk' | head -1 || true)"
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUTPUT"
          elif [ -n "$UNSIGNED" ]; then
            test -s mobile/android/app/debug.keystore
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" /tmp/GuitarTempoCoach-v270-aligned.apk
            "$BUILD_TOOLS/apksigner" sign --ks mobile/android/app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$OUTPUT" /tmp/GuitarTempoCoach-v270-aligned.apk
          else
            echo 'Release APK was not generated'; exit 1
          fi
          test -s "$OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'assets/index.android.bundle'
          BUNDLE_BYTES="$(unzip -p "$OUTPUT" assets/index.android.bundle | wc -c)"
          echo "Embedded JS bundle bytes: $BUNDLE_BYTES"
          test "$BUNDLE_BYTES" -gt 10000
          unzip -t "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -lh "$OUTPUT"

      - name: Upload v2.7 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.7.0-release-apk
          path: |
            GuitarTempoCoach-v2.7.0-release.apk
            GuitarTempoCoach-v2.7.0-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
