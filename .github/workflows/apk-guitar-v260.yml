name: Build Guitar Training OS v2.6 APK

on:
  push:
    branches:
      - build/guitar-tempo-coach-v1-apk-clean
    paths:
      - '.github/workflows/apk-guitar-v260.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified v2.5 source baseline
        uses: actions/download-artifact@v4
        with:
          name: GuitarTempoCoach-v2.5.0-source
          path: baseline
          github-token: ${{ github.token }}
          repository: seungjae3908-source/guitar-coach-app
          run-id: 35177840141

      - name: Restore verified v2.5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile
          mkdir mobile
          unzip -q baseline/GuitarTempoCoach-v2.5.0-source.zip -d mobile
          test "$(node -p "require('./mobile/package.json').version")" = '2.5.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.5.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '11'

      - name: Apply verified v2.6 Responsive Tone Rig patch
        shell: bash
        run: |
          set -euo pipefail
          cat tempo-coach-v1/.patch_v260/patch{00..32}.txt > /tmp/v260.b64
          base64 --decode /tmp/v260.b64 > /tmp/v260.patch.gz
          echo '64dfda3070220baa8931d2fafce34fa26df33e946c4c11dfd36db37541c4ac3e  /tmp/v260.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v260.patch.gz > /tmp/v260.patch
          echo '5caa064f1f3245894b2fc38533b8ffcbdbc28e06c490d913b2461399ae036306  /tmp/v260.patch' | sha256sum -c -
          patch -p1 -d mobile < /tmp/v260.patch

          test "$(node -p "require('./mobile/package.json').version")" = '2.6.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.6.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '12'

          if grep -R -F 'ScrollView' mobile/src/screens; then
            echo 'ScrollView remains in a main screen'; exit 1
          fi

          grep -F 'GUITAR TRAINING OS 2.6' mobile/src/screens/HomeScreen.tsx
          grep -F 'PRACTICE OS 2.6' mobile/src/screens/PracticeScreen.tsx
          grep -F 'STUDIO 2.6' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'SONG LAB 2.6' mobile/src/screens/SongLabScreen.tsx

          grep -F 'BOSS GT-1 + YAMAHA THR-II' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'GT-1 FX → THR AMP' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'GT-1 FULL → THR FLAT' mobile/src/screens/AnalyzerScreen.tsx
          grep -F '현재 이펙터 조합으로 듣기' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'playToneRig' mobile/src/hooks/useGuitarDemo.ts
          grep -F 'driveByType' mobile/src/hooks/useGuitarDemo.ts
          grep -F 'matchSongTone' mobile/src/domain/toneRig.ts
          grep -F 'ARTIST MATCH' mobile/src/domain/toneRig.ts
          grep -F 'toneMatchAuto' mobile/src/types.ts
          grep -F 'toneMatchAuto' mobile/src/storage/appStorage.ts
          grep -F 'TONE MATCH · BOSS GT-1 + THR-II' mobile/src/screens/SongLabScreen.tsx

          grep -F 'minimumFontScale' mobile/src/components/UI.tsx
          grep -F 'adjustsFontSizeToFit' mobile/src/components/UI.tsx
          grep -F 'minWidth:0' mobile/src/components/UI.tsx
          grep -F 'minimumFontScale' mobile/App.tsx
          grep -F 'compact=height<820||width<380' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'compact=height<820||width<380' mobile/src/screens/PracticeScreen.tsx
          grep -F 'compact=height<820||width<380' mobile/src/screens/SongLabScreen.tsx

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect, sign and verify v2.6 APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$BUILD_TOOLS"
          RELEASE_DIR='mobile/android/app/build/outputs/apk/release'
          OUTPUT='GuitarTempoCoach-v2.6.0-release.apk'
          SIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -1 || true)"
          UNSIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*unsigned.apk' | head -1 || true)"
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUTPUT"
          elif [ -n "$UNSIGNED" ]; then
            test -s mobile/android/app/debug.keystore
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" /tmp/GuitarTempoCoach-v260-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks mobile/android/app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT" \
              /tmp/GuitarTempoCoach-v260-aligned.apk
          else
            echo 'Release APK was not generated'; exit 1
          fi
          test -s "$OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'assets/index.android.bundle'
          BUNDLE_BYTES="$(unzip -p "$OUTPUT" assets/index.android.bundle | wc -c)"
          echo "Embedded JS bundle bytes: $BUNDLE_BYTES"
          test "$BUNDLE_BYTES" -gt 10000
          unzip -t "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -lh "$OUTPUT"

      - name: Upload v2.6 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.6.0-release-apk
          path: |
            GuitarTempoCoach-v2.6.0-release.apk
            GuitarTempoCoach-v2.6.0-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
