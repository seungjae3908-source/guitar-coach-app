name: One-time corrected focus integration trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-time-focus-trigger-pr-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute corrected exact patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-time-focus-analysis-youtube.yml').read_text()
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n\n      - name: Type-check and run quality regression tests"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          raw_lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw_lines)

          old_url_block = '\n'.join([
              'count = text.count(old_load)',
              'if count != 2:',
              "    raise SystemExit(f'song stored URL load: expected 2 matches, found {count}')",
              'text = text.replace(old_load, new_load)',
          ])
          new_url_block = '\n'.join([
              'count = text.count(old_load)',
              'if count != 1:',
              "    raise SystemExit(f'song stored URL load: expected 1 top-level match, found {count}')",
              'text = text.replace(old_load, new_load, 1)',
              'old_load_nested = "        setYoutubeUrl(stored?.youtubeUrl ?? \'\');\\n        setSyncOffsetSeconds(stored?.syncOffsetSeconds ?? 0);"',
              'new_load_nested = "        const loadedUrl = normalizeYouTubeUrl(stored?.youtubeUrl ?? \'\') ?? \'\';\\n        setYoutubeUrl(loadedUrl);\\n        setAppliedYoutubeUrl(loadedUrl);\\n        setSyncOffsetSeconds(stored?.syncOffsetSeconds ?? 0);"',
              'nested_count = text.count(old_load_nested)',
              'if nested_count != 1:',
              "    raise SystemExit(f'song stored URL load: expected 1 nested match, found {nested_count}')",
              'text = text.replace(old_load_nested, new_load_nested, 1)',
          ])
          if old_url_block not in script:
              raise SystemExit('stored URL patch block not found in registered script')
          script = script.replace(old_url_block, new_url_block, 1)

          old_reset_block = '\n'.join([
              'text = replace_once(',
              '    text,',
              '    "    fullPassRef.current = \'pose\';",',
              '    "    fullPassRef.current = \'pose\';\\n    handFrameIndexRef.current = 0;",',
              "    'camera reset frame counter',",
              ')',
          ])
          new_reset_block = '\n'.join([
              'text = replace_once(',
              '    text,',
              '    "    setCameraKey((value) => value + 1);\\n    fullPassRef.current = \'pose\';\\n  }, [activeMode]);",',
              '    "    setCameraKey((value) => value + 1);\\n    fullPassRef.current = \'pose\';\\n    handFrameIndexRef.current = 0;\\n  }, [activeMode]);",',
              "    'camera reset frame counter',",
              ')',
          ])
          if old_reset_block not in script:
              raise SystemExit('camera reset patch block not found in registered script')
          script = script.replace(old_reset_block, new_reset_block, 1)

          old_wrist_call = "text = replace_once(text, old_dots, new_dots, 'wrist overlay')"
          new_wrist_call = '\n'.join([
              "wrist_overlay_start = text.index('      {result.landmarks.map((point) => (')",
              "wrist_overlay_end = text.index('      {result.pick.detected ? (', wrist_overlay_start)",
              'text = text[:wrist_overlay_start] + new_dots + text[wrist_overlay_end:]',
          ])
          if old_wrist_call not in script:
              raise SystemExit('wrist overlay call not found in registered script')
          script = script.replace(old_wrist_call, new_wrist_call, 1)

          old_sample_block = '\n'.join([
              'text = replace_once(',
              '    text,',
              "    '    handConfidence: result.handednessScore,\\n    palmSize,',",
              '    "    handConfidence: result.handednessScore,\\n    wristConfidence: Math.min(\\n      1,\\n      result.handednessScore\\n        * Math.min(1, Math.min(wrist.x, 1 - wrist.x, wrist.y, 1 - wrist.y) / 0.07)\\n        * Math.min(1, palmSize / 0.16),\\n    ),\\n    palmSize,",',
              "    'right hand wrist confidence sample',",
              ')',
          ])
          new_sample_block = '\n'.join([
              'text = replace_once(',
              '    text,',
              "    '    pattern: context.pattern,\\n    handConfidence: result.handednessScore,\\n    palmSize,',",
              '    "    pattern: context.pattern,\\n    handConfidence: result.handednessScore,\\n    wristConfidence: Math.min(\\n      1,\\n      result.handednessScore\\n        * Math.min(1, Math.min(wrist.x, 1 - wrist.x, wrist.y, 1 - wrist.y) / 0.07)\\n        * Math.min(1, palmSize / 0.16),\\n    ),\\n    palmSize,",',
              "    'right hand wrist confidence sample',",
              ')',
          ])
          if old_sample_block not in script:
              raise SystemExit('right-hand wrist confidence block not found in registered script')
          script = script.replace(old_sample_block, new_sample_block, 1)

          exec(compile(script, 'focus-integration-patch.py', 'exec'))
          for temporary in [
              '.github/workflows/one-time-focus-trigger-pr.yml',
              '.github/workflows/one-time-focus-trigger-pr-v2.yml',
          ]:
              Path(temporary).unlink(missing_ok=True)
          PY

      - name: Type-check and run quality regression tests
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Commit integrated implementation
        run: |
          git config user.name guitar-coach-focus-bot
          git config user.email guitar-coach-focus-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Activate focus modes, wrist tracking, and YouTube selection"
          git push origin HEAD:agent/live-coach-compat-v055
