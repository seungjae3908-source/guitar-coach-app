name: One-time corrected focus integration trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-time-focus-trigger-pr-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute corrected exact patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-time-focus-analysis-youtube.yml').read_text()
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n\n      - name: Type-check and run quality regression tests"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          raw_lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw_lines)
          old_block = '''count = text.count(old_load)
if count != 2:
    raise SystemExit(f'song stored URL load: expected 2 matches, found {count}')
text = text.replace(old_load, new_load)'''
          new_block = '''count = text.count(old_load)
if count != 1:
    raise SystemExit(f'song stored URL load: expected 1 top-level match, found {count}')
text = text.replace(old_load, new_load, 1)
old_load_nested = "        setYoutubeUrl(stored?.youtubeUrl ?? '');\\n        setSyncOffsetSeconds(stored?.syncOffsetSeconds ?? 0);"
new_load_nested = "        const loadedUrl = normalizeYouTubeUrl(stored?.youtubeUrl ?? '') ?? '';\\n        setYoutubeUrl(loadedUrl);\\n        setAppliedYoutubeUrl(loadedUrl);\\n        setSyncOffsetSeconds(stored?.syncOffsetSeconds ?? 0);"
nested_count = text.count(old_load_nested)
if nested_count != 1:
    raise SystemExit(f'song stored URL load: expected 1 nested match, found {nested_count}')
text = text.replace(old_load_nested, new_load_nested, 1)'''
          if old_block not in script:
            raise SystemExit('stored URL patch block not found in registered script')
          script = script.replace(old_block, new_block, 1)
          exec(compile(script, 'focus-integration-patch.py', 'exec'))
          for temporary in [
            '.github/workflows/one-time-focus-trigger-pr.yml',
            '.github/workflows/one-time-focus-trigger-pr-v2.yml',
          ]:
            Path(temporary).unlink(missing_ok=True)
          PY

      - name: Type-check and run quality regression tests
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

      - name: Commit integrated implementation
        run: |
          git config user.name guitar-coach-focus-bot
          git config user.email guitar-coach-focus-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Activate focus modes, wrist tracking, and YouTube selection"
          git push origin HEAD:agent/live-coach-compat-v055
