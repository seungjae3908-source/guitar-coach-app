name: Build Guitar Training OS v2.5 APK

on:
  push:
    branches:
      - build/guitar-tempo-coach-v1-apk-clean
    paths:
      - '.github/workflows/apk-guitar-v250.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified v2.3 source baseline
        uses: actions/download-artifact@v4
        with:
          name: GuitarTempoCoach-v2.3.0-source
          path: baseline
          github-token: ${{ github.token }}
          repository: seungjae3908-source/guitar-coach-app
          run-id: 35169887707

      - name: Restore verified v2.4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile
          mkdir mobile
          unzip -q baseline/GuitarTempoCoach-v2.3.0-source.zip -d mobile
          test "$(node -p "require('./mobile/package.json').version")" = '2.3.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '9'

          cat tempo-coach-v1/.patch_v240/patch{00..13}.txt > /tmp/v240.b64
          base64 --decode /tmp/v240.b64 > /tmp/v240.patch.gz
          echo 'e51f8b1e9ebe51cc83a7f7120237e293068a52e8e49700fb01892681b2b070e0  /tmp/v240.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v240.patch.gz > /tmp/v240.patch
          echo '56e1e711b16ae2453f6e5f3c2eeae3c1596b3721be21da7e2de097f465b2d69d  /tmp/v240.patch' | sha256sum -c -
          patch -p4 -d mobile < /tmp/v240.patch
          test "$(node -p "require('./mobile/package.json').version")" = '2.4.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.4.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '10'

      - name: Apply verified v2.5 Song Lab patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tempo-coach-v1/.patch_v250/repair00a.txt \
            tempo-coach-v1/.patch_v250/repair00b1.txt \
            tempo-coach-v1/.patch_v250/repair00b2.txt \
            tempo-coach-v1/.patch_v250/patch01.txt \
            tempo-coach-v1/.patch_v250/patch02.txt \
            tempo-coach-v1/.patch_v250/patch03.txt \
            tempo-coach-v1/.patch_v250/patch04.txt \
            tempo-coach-v1/.patch_v250/patch05.txt \
            tempo-coach-v1/.patch_v250/patch06.txt \
            tempo-coach-v1/.patch_v250/patch07.txt \
            tempo-coach-v1/.patch_v250/patch08.txt \
            tempo-coach-v1/.patch_v250/patch09.txt \
            tempo-coach-v1/.patch_v250/patch10.txt \
            tempo-coach-v1/.patch_v250/patch11.txt \
            tempo-coach-v1/.patch_v250/patch12.txt \
            tempo-coach-v1/.patch_v250/patch13.txt > /tmp/v250.b64
          base64 --decode /tmp/v250.b64 > /tmp/v250.patch.gz
          echo 'a7455e5221efe9a162f4a573a08db73ebe95041ff006ba1e21fadd2ec384da68  /tmp/v250.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v250.patch.gz > /tmp/v250.patch
          echo '9c0875e3c5e5dccd8380bf452be4a84b98069696ace17465b444af01f9344a2f  /tmp/v250.patch' | sha256sum -c -
          patch -p1 -d mobile < /tmp/v250.patch

          test "$(node -p "require('./mobile/package.json').version")" = '2.5.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.5.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '11'
          if grep -R -F 'ScrollView' mobile/src/screens; then echo 'ScrollView remains in a main screen'; exit 1; fi
          grep -F 'SONG LAB 2.5' mobile/src/screens/SongLabScreen.tsx
          grep -F 'GUITAR TRAINING OS 2.5' mobile/src/screens/HomeScreen.tsx
          grep -F 'PRACTICE OS 2.5' mobile/src/screens/PracticeScreen.tsx
          grep -F 'STUDIO 2.5' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'searchSongCatalog' mobile/src/domain/songLab.ts
          grep -F 'parseMusicXml' mobile/src/domain/songLab.ts
          grep -F 'Song Lab Adaptation' mobile/src/domain/songLab.ts
          grep -F 'CALL · 2마디' mobile/src/screens/SongLabScreen.tsx
          grep -F 'COPY · 연습 레슨 시작' mobile/src/screens/SongLabScreen.tsx
          grep -F 'Take A/B' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'expo-document-picker' mobile/package.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect, sign and verify v2.5 APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$BUILD_TOOLS"
          RELEASE_DIR='mobile/android/app/build/outputs/apk/release'
          OUTPUT='GuitarTempoCoach-v2.5.0-release.apk'
          SIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -1 || true)"
          UNSIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*unsigned.apk' | head -1 || true)"
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUTPUT"
          elif [ -n "$UNSIGNED" ]; then
            test -s mobile/android/app/debug.keystore
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" /tmp/GuitarTempoCoach-v250-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks mobile/android/app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT" \
              /tmp/GuitarTempoCoach-v250-aligned.apk
          else
            echo 'Release APK was not generated'; exit 1
          fi
          test -s "$OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'assets/index.android.bundle'
          BUNDLE_BYTES="$(unzip -p "$OUTPUT" assets/index.android.bundle | wc -c)"
          echo "Embedded JS bundle bytes: $BUNDLE_BYTES"
          test "$BUNDLE_BYTES" -gt 10000
          unzip -t "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -lh "$OUTPUT"

      - name: Upload v2.5 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.5.0-release-apk
          path: |
            GuitarTempoCoach-v2.5.0-release.apk
            GuitarTempoCoach-v2.5.0-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
