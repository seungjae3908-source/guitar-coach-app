name: Publish web preview and Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      - name: Build Android test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build web preview
        working-directory: web
        run: npm run build

      - name: Add APK to web site
        run: |
          mkdir -p web/dist/downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk web/dist/downloads/guitar-coach-ai.apk
          test -s web/dist/downloads/guitar-coach-ai.apk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
