name: Publish web preview and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: link-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      - name: Build Android test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build web preview
        working-directory: web
        run: npm run build

      - name: Add APK to web site
        run: |
          mkdir -p web/dist/downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk web/dist/downloads/guitar-coach-ai.apk
          test -s web/dist/downloads/guitar-coach-ai.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-ai-apk
          path: web/dist/downloads/guitar-coach-ai.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk='web/dist/downloads/guitar-coach-ai.apk'
          tag='preview-latest'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#기타-코치-AI.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk#기타-코치-AI.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title '기타 코치 AI 휴대폰 테스트판' \
              --notes '휴대폰 UI 확인용 테스트 APK입니다. 카메라·마이크·영상 분석 기능은 아직 연결되지 않았습니다.' \
              --prerelease
          fi

      - name: Ensure GitHub Pages site exists
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")
          if [ "$code" = '404' ]; then
            create_code=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" \
              -d '{"build_type":"workflow"}')
            cat /tmp/pages-create.json
            if [ "$create_code" != '201' ] && [ "$create_code" != '409' ]; then
              echo "Pages creation failed with HTTP ${create_code}"
              exit 1
            fi
          elif [ "$code" != '200' ]; then
            cat /tmp/pages-get.json
            echo "Pages lookup failed with HTTP ${code}"
            exit 1
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
