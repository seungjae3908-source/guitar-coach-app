name: Publish web preview

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish-links.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish-links.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Test evidence-gated web vision logic
        working-directory: web
        run: npm test

      - name: Build web preview
        working-directory: web
        run: npm run build

      - name: Verify web-only output
        shell: bash
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          if find web/dist -type f -name '*.apk' -print -quit | grep -q .; then
            echo 'APK found in web output. Web-only publishing is required.'
            exit 1
          fi
          grep -R -q '전면카메라 연결' web/dist/assets
          grep -R -q '전면 고정' web/dist/assets
          grep -R -q '카메라 시작 · 전면 웹 고정' web/dist/assets

      - name: Ensure GitHub Pages site exists
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")
          if [ "$code" = '404' ]; then
            curl -sS -o /tmp/pages-create.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" \
              -d '{"build_type":"workflow"}'
            cat /tmp/pages-create.json
          else
            cat /tmp/pages-get.json
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
