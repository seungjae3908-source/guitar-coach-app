name: Publish web preview and compact Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/PUBLIC_LINK_STATUS.json'
      - '.github/workflows/verify-public-links.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: link-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      - name: Build compact ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

          build_tools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          tools="$ANDROID_HOME/build-tools/$build_tools"
          release_dir='app/build/outputs/apk/release'
          mkdir -p app/build/outputs/apk/compact
          output='app/build/outputs/apk/compact/guitar-coach-ai.apk'

          signed=$(find "$release_dir" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -n 1 || true)
          unsigned=$(find "$release_dir" -maxdepth 1 -type f -name '*unsigned.apk' | head -n 1 || true)

          if [ -n "$signed" ]; then
            cp "$signed" "$output"
          elif [ -n "$unsigned" ]; then
            "$tools/zipalign" -f 4 "$unsigned" /tmp/guitar-coach-ai-aligned.apk
            "$tools/apksigner" sign \
              --ks app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$output" \
              /tmp/guitar-coach-ai-aligned.apk
          else
            echo 'Release APK was not generated.'
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi

          "$tools/apksigner" verify --verbose "$output"
          size=$(stat -c%s "$output")
          echo "Compact APK size: $size bytes"
          test "$size" -gt 1000000
          test "$size" -lt 80000000

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build web preview
        working-directory: web
        run: npm run build

      - name: Add compact APK to web bundle
        run: |
          mkdir -p web/dist/downloads
          cp mobile/android/app/build/outputs/apk/compact/guitar-coach-ai.apk web/dist/downloads/guitar-coach-ai.apk
          test -s web/dist/downloads/guitar-coach-ai.apk
          ls -lh web/dist/downloads/guitar-coach-ai.apk

      - name: Upload compact APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-ai-arm64-apk
          path: web/dist/downloads/guitar-coach-ai.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable compact APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk='web/dist/downloads/guitar-coach-ai.apk'
          tag='preview-latest'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#guitar-coach-ai.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk#guitar-coach-ai.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title '기타 코치 AI 휴대폰 테스트판' \
              --notes 'ARM64 안드로이드 휴대폰용 경량 테스트 APK입니다. 카메라·마이크·영상 분석 기능은 아직 연결되지 않았습니다.' \
              --prerelease
          fi

      - name: Ensure GitHub Pages site exists
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")
          if [ "$code" = '404' ]; then
            curl -sS -o /tmp/pages-create.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" \
              -d '{"build_type":"workflow"}'
            cat /tmp/pages-create.json
          else
            cat /tmp/pages-get.json
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
