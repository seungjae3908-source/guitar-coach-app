name: One-time hand-only recovery

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  repair-build:
    if: github.event.pull_request.head.ref == 'agent/live-coach-compat-v055'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Apply hand-first camera patch
        run: python3 .github/scripts/apply-hand-only-recovery.py

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run typecheck and quality tests
        working-directory: mobile
        run: npm run typecheck

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "OpenAI Engineering"
          git config user.email "engineering@openai.invalid"
          git add \
            mobile/modules/guitar-coach-hand/index.ts \
            mobile/components/SessionCoachCamera.tsx \
            mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachHandModule.kt \
            mobile/services/fretboard-chord-engine.ts
          git diff --cached --check
          git commit -m "Fix hand-only recognition and strict chord confidence"
          git push origin HEAD:agent/live-coach-compat-v055

      - name: Generate Android native project
        working-directory: mobile
        env:
          CI: 1
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build and verify ARM64 release APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          build_tools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          tools="$ANDROID_HOME/build-tools/$build_tools"
          release_dir='app/build/outputs/apk/release'
          mkdir -p app/build/outputs/apk/final
          output='app/build/outputs/apk/final/guitar-coach-hand-only-recovery.apk'
          signed=$(find "$release_dir" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -n 1 || true)
          unsigned=$(find "$release_dir" -maxdepth 1 -type f -name '*unsigned.apk' | head -n 1 || true)
          if [ -n "$signed" ]; then
            cp "$signed" "$output"
          elif [ -n "$unsigned" ]; then
            "$tools/zipalign" -f 4 "$unsigned" /tmp/guitar-coach-hand-only-recovery-aligned.apk
            "$tools/apksigner" sign --ks app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$output" /tmp/guitar-coach-hand-only-recovery-aligned.apk
          else
            echo 'Release APK was not generated.'
            exit 1
          fi
          "$tools/apksigner" verify --verbose --print-certs "$output"
          test -s "$output"
          size=$(stat -c%s "$output")
          test "$size" -gt 1000000
          test "$size" -lt 80000000
          sha256sum "$output" | tee app/build/outputs/apk/final/SHA256SUMS.txt
          echo "Final APK size: $size bytes"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-hand-only-recovery-arm64-apk
          path: |
            mobile/android/app/build/outputs/apk/final/guitar-coach-hand-only-recovery.apk
            mobile/android/app/build/outputs/apk/final/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
