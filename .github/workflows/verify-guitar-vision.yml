name: Verify guitar vision

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - 'mobile/components/AutomaticGuitarCalibrationV9.tsx'
      - 'mobile/services/guitar-auto-detection.ts'
      - 'mobile/tests/guitar-auto-detection.test.ts'
      - 'mobile/modules/guitar-coach-native/**'
      - '.github/workflows/verify-guitar-vision.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-guitar-vision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck and unit tests
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Build Android debug app
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
