name: One-time v28 recognition build

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - '.github/v28_patch.py'
      - '.github/workflows/one-time-v28-recognition.yml'

permissions:
  contents: write

concurrency:
  group: one-time-v28-recognition
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/live-coach-compat-v055'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout v28 branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - name: Apply v28 recognition patch
        run: |
          python -m py_compile .github/v28_patch.py
          python .github/v28_patch.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck and executable tests
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: 1
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build and verify signed ARM64 APK
        working-directory: mobile/android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          build_tools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          tools="$ANDROID_HOME/build-tools/$build_tools"
          release_dir='app/build/outputs/apk/release'
          final_dir='app/build/outputs/apk/final-v28'
          mkdir -p "$final_dir"
          output="$final_dir/guitar-coach-v28-recognition-arm64.apk"
          signed=$(find "$release_dir" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -n 1 || true)
          unsigned=$(find "$release_dir" -maxdepth 1 -type f -name '*unsigned.apk' | head -n 1 || true)
          if [ -n "$signed" ]; then
            cp "$signed" "$output"
          elif [ -n "$unsigned" ]; then
            "$tools/zipalign" -f 4 "$unsigned" /tmp/guitar-coach-v28-aligned.apk
            "$tools/apksigner" sign --ks app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$output" /tmp/guitar-coach-v28-aligned.apk
          else
            echo 'Release APK was not generated.'
            exit 1
          fi
          "$tools/apksigner" verify --verbose --print-certs "$output" | tee "$final_dir/SIGNING-VERIFY.txt"
          test -s "$output"
          size=$(stat -c%s "$output")
          test "$size" -gt 1000000
          test "$size" -lt 110000000
          unzip -Z1 "$output" > "$final_dir/APK-ENTRIES.txt"
          grep -q '^lib/arm64-v8a/' "$final_dir/APK-ENTRIES.txt"
          if grep -Eq '^lib/(x86|x86_64|armeabi-v7a)/' "$final_dir/APK-ENTRIES.txt"; then
            echo 'Unexpected non-ARM64 native libraries were packaged.'
            exit 1
          fi
          sha256sum "$output" | tee "$final_dir/SHA256SUMS.txt"
          printf 'ABI=arm64-v8a\nSIZE=%s\nVERSION_CODE=28\n' "$size" | tee "$final_dir/BUILD-INFO.txt"

      - name: Upload verified v28 APK
        uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-v28-recognition-arm64-apk
          path: |
            mobile/android/app/build/outputs/apk/final-v28/guitar-coach-v28-recognition-arm64.apk
            mobile/android/app/build/outputs/apk/final-v28/SHA256SUMS.txt
            mobile/android/app/build/outputs/apk/final-v28/SIGNING-VERIFY.txt
            mobile/android/app/build/outputs/apk/final-v28/BUILD-INFO.txt
            mobile/android/app/build/outputs/apk/final-v28/APK-ENTRIES.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified v28 source only
        shell: bash
        run: |
          set -euo pipefail
          cat > mobile/V28_RECOGNITION_REPORT.md <<'EOF'
          # v28 recognition verification

          - Branch: `agent/live-coach-compat-v055`
          - PR: `#16` remains Draft and unmerged
          - Hand presence no longer depends on handedness classification confidence
          - Camera search cycles through wider zoom levels when a distant hand is not yet found
          - Hand detection runs every frame while searching
          - MediaPipe hand thresholds are relaxed for distant hands
          - String tracking survives short misses and uses wider geometry and contact tolerances
          - Automatic pick mode is no longer forced to green
          - Strum hit speed, approach, contact, and quality thresholds are relaxed
          - 850 ms strum lock remains unchanged
          - Typecheck and executable tests passed
          - Kotlin release compile and ARM64 APK build passed
          - APK signature and ABI were verified
          EOF
          rm -f .github/v28_patch.py .github/workflows/one-time-v28-recognition.yml
          git config user.name 'guitar-coach-v28-bot'
          git config user.email 'guitar-coach-v28-bot@users.noreply.github.com'
          git add \
            mobile/app.json \
            mobile/components/LiveLocalCoachCamera.tsx \
            mobile/modules/guitar-coach-continuous-camera/index.tsx \
            mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachContinuousCameraModule.kt \
            mobile/services/continuous-tracking-quality.ts \
            mobile/tests/continuous-tracking-quality.test.ts \
            mobile/V28_RECOGNITION_REPORT.md
          git add -u .github
          git commit -m 'Fix v28 distant hand and strum recognition'
          git reset --hard HEAD
          git clean -fdx mobile/android
          git clean -fdx mobile/modules/guitar-coach-native/android/src/main/assets
          git pull --rebase origin agent/live-coach-compat-v055
          git push origin HEAD:agent/live-coach-compat-v055
