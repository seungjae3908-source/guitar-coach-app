name: Build and publish debug center preview

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - 'web/**'
      - 'debug-server/**'
      - '.github/workflows/debug-center-preview.yml'
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - 'web/**'
      - 'debug-server/**'
      - '.github/workflows/debug-center-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guitar-coach-debug-center-static
  cancel-in-progress: true

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify relay server syntax
        working-directory: debug-server
        run: npm run check

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build portable debug center web
        working-directory: web
        run: npm run build -- --base=./

      - name: Verify debug center output
        shell: bash
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          grep -R -q '기타 코치 실시간 진단센터' web/dist/assets
          grep -R -q '원격 진단 관리자' web/dist/assets
          grep -q 'src="./assets/' web/dist/index.html

      - name: Publish static preview to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf debug-site
          mkdir -p debug-site
          cp -R web/dist/. debug-site/
          touch debug-site/.nojekyll
          cat > debug-site/BUILD_INFO.txt <<EOF
          SOURCE_BRANCH=agent/live-coach-compat-v055
          SOURCE_SHA=${GITHUB_SHA}
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'guitar-coach-debug-center-bot'
          git config user.email 'guitar-coach-debug-center-bot@users.noreply.github.com'
          git add -A debug-site
          if git diff --cached --quiet; then
            echo 'Static preview is already current.'
            exit 0
          fi
          git commit -m 'Publish guided debug center static preview'
          git pull --rebase origin agent/live-coach-compat-v055
          git push origin HEAD:agent/live-coach-compat-v055

      - name: Upload verified static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-debug-center-site
          path: debug-site
          if-no-files-found: error
          retention-days: 30
