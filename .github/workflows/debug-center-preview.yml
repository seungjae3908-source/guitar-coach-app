name: Build and deploy complete debug center

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - 'web/**'
      - 'debug-server/**'
      - '.github/workflows/debug-center-preview.yml'
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - 'web/**'
      - 'debug-server/**'
      - '.github/workflows/debug-center-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guitar-coach-debug-center-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify relay server
        working-directory: debug-server
        run: npm run verify

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build debug center web
        working-directory: web
        run: npm run build

      - name: Verify built site
        shell: bash
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          grep -R -q '기타 코치 실시간 진단센터' web/dist/assets
          grep -R -q '원격 진단 관리자' web/dist/assets
          if grep -R -q 'raw.githack\|rawgit.hack' web/dist; then
            echo 'Third-party raw host reference found.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: verify-and-build
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
