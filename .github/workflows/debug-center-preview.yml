name: Build and deploy complete debug center

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - 'web/**'
      - 'debug-server/**'
      - 'render.yaml'
      - '.github/workflows/debug-center-preview.yml'
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - 'web/**'
      - 'debug-server/**'
      - 'render.yaml'
      - '.github/workflows/debug-center-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guitar-coach-debug-center-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify relay server
        working-directory: debug-server
        run: npm run verify

      - name: Verify production deployment blueprint
        shell: bash
        run: |
          set -euo pipefail
          test -s render.yaml
          grep -q 'rootDir: debug-server' render.yaml
          grep -q 'healthCheckPath: /health' render.yaml
          grep -q 'ADMIN_SHARED_SECRET' render.yaml
          grep -q 'DEVICE_SHARED_SECRET' render.yaml
          grep -q 'https://seungjae3908-source.github.io' render.yaml

      - name: Verify diagnostic center is the public entry point
        shell: bash
        run: |
          set -euo pipefail
          grep -q "return <DebugCenter />" web/src/AppSafe.jsx
          if grep -q "params.get('debug')" web/src/AppSafe.jsx; then
            echo 'Diagnostic center still requires a hidden query parameter.'
            exit 1
          fi

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build debug center web
        working-directory: web
        run: npm run build

      - name: Verify built site
        shell: bash
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          grep -R -q '기타 코치 실시간 진단센터' web/dist/assets
          grep -R -q '원격 진단 관리자' web/dist/assets
          if grep -R -q 'raw.githack\|rawgit.hack' web/dist; then
            echo 'Third-party raw host reference found.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-24.04
    needs: verify-and-build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed HTTPS site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          case "$PAGE_URL" in
            https://*.github.io/*) ;;
            *) echo "Unexpected Pages URL: $PAGE_URL"; exit 1 ;;
          esac

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "${PAGE_URL}?verification=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -o /tmp/deployed-index.html; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo 'Deployed site did not become reachable.'
              exit 1
            fi
            sleep 5
          done

          grep -q '<div id="root"></div>' /tmp/deployed-index.html
          if grep -qi 'rawgit\.hack\|raw\.githack\|one more step' /tmp/deployed-index.html; then
            echo 'A third-party warning/interstitial page was returned.'
            exit 1
          fi

          script_path=$(grep -oE 'src="[^"]+\.js"' /tmp/deployed-index.html | head -n 1 | cut -d'"' -f2)
          test -n "$script_path"
          script_url=$(node -e 'console.log(new URL(process.argv[1], process.argv[2]).href)' "$script_path" "$PAGE_URL")
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "$script_url" -o /tmp/deployed-app.js

          grep -q '기타 코치 실시간 진단센터' /tmp/deployed-app.js
          grep -q '원격 진단 관리자' /tmp/deployed-app.js
          if grep -qi 'rawgit\.hack\|raw\.githack' /tmp/deployed-app.js; then
            echo 'The deployed app still references a third-party raw host.'
            exit 1
          fi

          echo "Verified deployed site: $PAGE_URL"
