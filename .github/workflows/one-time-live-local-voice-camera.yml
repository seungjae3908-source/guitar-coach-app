name: One-time live local voice camera build

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - .github/live-local-voice-camera-trigger.txt

permissions:
  contents: write

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - name: Apply live local recognition patch
        run: python3 .github/scripts/apply-live-local-voice-camera.py

      - name: Remove one-time automation files
        run: |
          rm -f .github/scripts/apply-live-local-voice-camera.py
          rm -f .github/workflows/one-time-live-local-voice-camera.yml
          rm -f .github/live-local-voice-camera-trigger.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type check
        working-directory: mobile
        run: npm run typecheck

      - name: Run full analysis quality suite
        working-directory: mobile
        run: npm run quality:analysis

      - name: Commit verified source candidate
        run: |
          git config user.name "guitar-coach-build-bot"
          git config user.email "guitar-coach-build-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: live local hand guitar recognition and voice UI"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        working-directory: mobile
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build ARM64 release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Sign and verify test APK
        run: |
          set -euo pipefail
          UNSIGNED_APK=$(find mobile/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$UNSIGNED_APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          keytool -genkeypair -v \
            -keystore /tmp/guitar-coach-test.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Guitar Coach Test,O=Seungjae,C=KR"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED_APK" /tmp/guitar-coach-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/guitar-coach-test.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out guitar-coach-live-local-voice-v25.apk \
            /tmp/guitar-coach-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs guitar-coach-live-local-voice-v25.apk
          sha256sum guitar-coach-live-local-voice-v25.apk > SHA256SUMS.txt

      - name: Push verified source
        run: git push origin HEAD:agent/live-coach-compat-v055

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-live-local-voice-v25
          path: |
            guitar-coach-live-local-voice-v25.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
