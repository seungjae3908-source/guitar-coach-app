name: One-time focus analysis and YouTube integration

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - .github/workflows/one-time-focus-analysis-youtube.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply exact integration patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # YouTube URL parser is a pure service so it can be tested without React Native.
          path = 'mobile/components/YouTubePracticePlayer.tsx'
          text = read(path)
          anchor = "import { WebView, type WebViewMessageEvent } from 'react-native-webview';\n"
          text = replace_once(
              text,
              anchor,
              anchor + "\nimport { extractYouTubeVideoId, normalizeYouTubeUrl } from '../services/youtube-url';\n\nexport { extractYouTubeVideoId, normalizeYouTubeUrl } from '../services/youtube-url';\n",
              'youtube player service import',
          )
          start = text.index('const VIDEO_ID_PATTERN =')
          end = text.index('function stateFromCode')
          text = text[:start] + text[end:]
          write(path, text)

          path = 'mobile/components/YouTubeSearchPicker.tsx'
          text = read(path)
          text = replace_once(
              text,
              "import { normalizeYouTubeUrl } from './YouTubePracticePlayer';",
              "import { normalizeYouTubeUrl } from '../services/youtube-url';",
              'youtube picker parser import',
          )
          write(path, text)

          path = 'mobile/tests/youtube-url.test.ts'
          text = read(path)
          text = replace_once(
              text,
              "import { extractYouTubeVideoId, normalizeYouTubeUrl } from '../components/YouTubePracticePlayer';",
              "import { extractYouTubeVideoId, normalizeYouTubeUrl } from '../services/youtube-url';",
              'youtube test parser import',
          )
          write(path, text)

          # Song studio: in-app search selection, canonical URL apply, 1.5x and ±5 seconds.
          path = 'mobile/components/MasterSongStudioPanel.tsx'
          text = read(path)
          text = text.replace('  Linking,\n', '', 1)
          text = replace_once(
              text,
              "import YouTubePracticePlayer, { type YouTubePlayerState } from './YouTubePracticePlayer';",
              "import YouTubePracticePlayer, { type YouTubePlayerState, type YouTubeSeekRequest } from './YouTubePracticePlayer';\nimport YouTubeSearchPicker from './YouTubeSearchPicker';\nimport { normalizeYouTubeUrl } from '../services/youtube-url';",
              'song studio youtube imports',
          )
          text = replace_once(text, 'const SPEEDS = [0.5, 0.75, 1, 1.25] as const;', 'const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5] as const;', 'song speeds')
          text = replace_once(
              text,
              "  const [youtubeUrl, setYoutubeUrl] = useState('');\n  const [duration, setDuration] = useState(0);",
              "  const [youtubeUrl, setYoutubeUrl] = useState('');\n  const [appliedYoutubeUrl, setAppliedYoutubeUrl] = useState('');\n  const [youtubeSearchVisible, setYoutubeSearchVisible] = useState(false);\n  const [seekRequest, setSeekRequest] = useState<YouTubeSeekRequest | null>(null);\n  const [duration, setDuration] = useState(0);",
