'''
          text = replace_once(text, wrist_gate_anchor, wrist_gate + wrist_gate_anchor, 'wrist reliability gate')
          write(path, text)

          # Decode camera JPEGs at analysis resolution instead of processing 12 MP every frame.
          path = 'mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachHandModule.kt'
          text = read(path)
          start = text.index('  private fun decodeBitmap(uriString: String): Bitmap {')
          end = text.index('  private fun cleanupFile', start)
          decode = '''  private fun decodeBitmap(uriString: String): Bitmap {
    val context = appContext.reactContext
      ?: throw IllegalStateException("Android 손 분석 컨텍스트를 사용할 수 없습니다.")
    val uri = Uri.parse(uriString)
    val bytes = when (uri.scheme) {
      "content" -> context.contentResolver.openInputStream(uri)
        ?.use { it.readBytes() }
        ?: throw IllegalArgumentException("카메라 파일을 열 수 없습니다.")
      "file" -> FileInputStream(File(requireNotNull(uri.path))).use { it.readBytes() }
      else -> FileInputStream(File(uriString)).use { it.readBytes() }
    }

    val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
    BitmapFactory.decodeByteArray(bytes, 0, bytes.size, bounds)
    if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
      throw IllegalArgumentException("카메라 이미지 크기를 읽지 못했습니다.")
    }
    var sampleSize = 1
    while (max(bounds.outWidth, bounds.outHeight) / sampleSize > 1_280) sampleSize *= 2
    val options = BitmapFactory.Options().apply {
      inSampleSize = sampleSize
      inPreferredConfig = Bitmap.Config.ARGB_8888
    }
    return BitmapFactory.decodeByteArray(bytes, 0, bytes.size, options)
      ?: throw IllegalArgumentException("카메라 이미지를 읽지 못했습니다.")
  }

'''
