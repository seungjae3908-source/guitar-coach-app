              '<Pressable onPress={openSearch} style={styles.secondaryButton}><Text style={styles.secondaryText}>앱 안에서 YouTube 검색</Text></Pressable>\n          <Pressable onPress={() => void saveStudio()} style={styles.primarySmall}><Text style={styles.primarySmallText}>링크 적용·저장</Text></Pressable>',
