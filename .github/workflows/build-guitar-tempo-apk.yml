name: Build GuitarTempo Coach APK

on:
  push:
    branches:
      - build/guitar-tempo-coach-v1-apk
    paths:
      - 'tempo-coach-apk/**'
      - '.github/workflows/build-guitar-tempo-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tempo-coach-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: tempo-coach-apk/package.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "sdkmanager=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Generate metronome assets
        run: |
          mkdir -p assets
          python3 - <<'PY'
          import math, wave, struct
          def make(path, freq, ms, volume):
              rate=44100
              n=int(rate*ms/1000)
              with wave.open(path,'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
                  frames=[]
                  for i in range(n):
                      env=math.exp(-7*i/max(1,n))
                      v=int(32767*volume*env*math.sin(2*math.pi*freq*i/rate))
                      frames.append(struct.pack('<h',v))
                  w.writeframes(b''.join(frames))
          make('assets/click.wav',1200,38,.55)
          make('assets/accent.wav',1900,48,.70)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo config check
        run: npx expo config --type public >/tmp/expo-config.txt && cat /tmp/expo-config.txt

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GuitarTempoCoach-v1.0.0.apk
          sha256sum GuitarTempoCoach-v1.0.0.apk | tee GuitarTempoCoach-v1.0.0.apk.sha256
          ls -lh GuitarTempoCoach-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-APK
          path: |
            tempo-coach-apk/GuitarTempoCoach-v1.0.0.apk
            tempo-coach-apk/GuitarTempoCoach-v1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 14
