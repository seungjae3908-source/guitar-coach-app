name: Build GuitarTempo APK

on:
  push:
    branches:
      - build/guitar-tempo-coach-v1-apk-clean
    paths:
      - '.github/workflows/apk-guitar-tempo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct v1.0 base source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tempo-coach-v1/.bundle/repair00a.txt \
            tempo-coach-v1/.bundle/repair00b.txt \
            tempo-coach-v1/.bundle/chunk01.txt \
            tempo-coach-v1/.bundle/chunk02.txt \
            tempo-coach-v1/.bundle/repair03a.txt \
            tempo-coach-v1/.bundle/repair03b.txt \
            tempo-coach-v1/.bundle/chunk04.txt \
            tempo-coach-v1/.bundle/chunk05.txt \
            tempo-coach-v1/.bundle/chunk06.txt \
            tempo-coach-v1/.bundle/chunk07.txt \
            tempo-coach-v1/.bundle/chunk08.txt \
            tempo-coach-v1/.bundle/chunk09.txt \
            tempo-coach-v1/.bundle/chunk10.txt \
            tempo-coach-v1/.bundle/chunk11.txt \
            tempo-coach-v1/.bundle/chunk12.txt \
            > /tmp/guitar-project.b64
          base64 --decode /tmp/guitar-project.b64 > /tmp/guitar_apk_clean.zip
          echo 'cbed50f6cfbffa73f2a60ba38ef951ae77c523d83d0f6812e0c2524694ea6e78  /tmp/guitar_apk_clean.zip' | sha256sum -c -
          unzip -t /tmp/guitar_apk_clean.zip
          rm -rf mobile
          mkdir mobile
          unzip -q /tmp/guitar_apk_clean.zip -d mobile
          test -s mobile/package.json
          test -s mobile/App.tsx

      - name: Apply v1.1 UI and metronome patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tempo-coach-v1/.patch_v110/patch00.txt \
            tempo-coach-v1/.patch_v110/patch01.txt \
            tempo-coach-v1/.patch_v110/patch02.txt \
            tempo-coach-v1/.patch_v110/patch03.txt \
            tempo-coach-v1/.patch_v110/patch04.txt \
            tempo-coach-v1/.patch_v110/patch05.txt \
            tempo-coach-v1/.patch_v110/patch06.txt \
            tempo-coach-v1/.patch_v110/patch07.txt \
            tempo-coach-v1/.patch_v110/patch08.txt \
            tempo-coach-v1/.patch_v110/patch09.txt \
            tempo-coach-v1/.patch_v110/patch10.txt \
            > /tmp/v110.patch.gz.b64
          base64 --decode /tmp/v110.patch.gz.b64 > /tmp/v110.patch.gz
          echo '85cd542a2d1dd092d0bb2d360cca9bbb2a415e3c3ad1d8f8e8576661d0d4ffb2  /tmp/v110.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v110.patch.gz > /tmp/v110.patch
          patch -p1 -d mobile < /tmp/v110.patch
          test "$(node -p "require('./mobile/package.json').version")" = '1.1.0'

      - name: Apply v1.2 single-screen metronome patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tempo-coach-v1/.patch_v120/patch00.txt \
            tempo-coach-v1/.patch_v120/patch01.txt \
            tempo-coach-v1/.patch_v120/patch02.txt \
            tempo-coach-v1/.patch_v120/patch03.txt \
            > /tmp/v120.patch.gz.b64
          base64 --decode /tmp/v120.patch.gz.b64 > /tmp/v120.patch.gz
          echo '6c6bfa89db89254192d03210b0766b95a1b4fc958edbe5fc7a4ce0a67304bc8c  /tmp/v120.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v120.patch.gz > /tmp/v120.patch
          echo '949bc878f720704fd403b42e9611293191b243287ce0e09a1d10e70389c8b964  /tmp/v120.patch' | sha256sum -c -
          patch -p1 -d mobile < /tmp/v120.patch
          test "$(node -p "require('./mobile/package.json').version")" = '1.2.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '4'
          ! grep -F 'ScrollView' mobile/src/screens/MetronomeScreen.tsx
          grep -F "type Sheet='meter'|'subdivision'|'sound'|'trainer'|null" mobile/src/screens/MetronomeScreen.tsx
          grep -F 'Tempo Ramp' mobile/src/screens/MetronomeScreen.tsx
          grep -F 'Gap Trainer' mobile/src/screens/MetronomeScreen.tsx

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect, sign and verify standalone APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$BUILD_TOOLS"
          RELEASE_DIR='mobile/android/app/build/outputs/apk/release'
          OUTPUT='GuitarTempoCoach-v1.2.0-release.apk'

          SIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -1 || true)"
          UNSIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*unsigned.apk' | head -1 || true)"

          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUTPUT"
          elif [ -n "$UNSIGNED" ]; then
            test -s mobile/android/app/debug.keystore
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" /tmp/GuitarTempoCoach-v120-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks mobile/android/app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT" \
              /tmp/GuitarTempoCoach-v120-aligned.apk
          else
            echo 'Release APK was not generated.'
            find mobile/android/app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi

          test -s "$OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'assets/index.android.bundle'
          BUNDLE_BYTES="$(unzip -p "$OUTPUT" assets/index.android.bundle | wc -c)"
          echo "Embedded JS bundle bytes: $BUNDLE_BYTES"
          test "$BUNDLE_BYTES" -gt 10000
          unzip -t "$OUTPUT"
          ls -lh "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload v1.2 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v1.2.0-release-apk
          path: |
            GuitarTempoCoach-v1.2.0-release.apk
            GuitarTempoCoach-v1.2.0-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
