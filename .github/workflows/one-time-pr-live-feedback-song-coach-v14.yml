name: One-time PR live feedback and song coach v14

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-time-pr-live-feedback-song-coach-v14.yml

permissions:
  contents: write

jobs:
  implement-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Execute registered implementation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/one-time-live-feedback-song-coach-v14.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install and run full quality gates"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, 'live-feedback-song-coach-v14.py', 'exec'))
          PY
      - name: Install and run full quality gates
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Generate Android native project
        working-directory: mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build and verify ARM64 APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          build_tools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          tools="$ANDROID_HOME/build-tools/$build_tools"
          release_dir='app/build/outputs/apk/release'
          output='app/build/outputs/apk/guitar-coach-ai-v14.apk'
          signed=$(find "$release_dir" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -n 1 || true)
          unsigned=$(find "$release_dir" -maxdepth 1 -type f -name '*unsigned.apk' | head -n 1 || true)
          if [ -n "$signed" ]; then
            cp "$signed" "$output"
          elif [ -n "$unsigned" ]; then
            "$tools/zipalign" -f 4 "$unsigned" /tmp/guitar-coach-ai-v14-aligned.apk
            "$tools/apksigner" sign --ks app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$output" /tmp/guitar-coach-ai-v14-aligned.apk
          else
            exit 1
          fi
          "$tools/apksigner" verify --verbose "$output"
          test $(stat -c%s "$output") -gt 1000000
          sha256sum "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-ai-live-song-coach-v14-apk
          path: mobile/android/app/build/outputs/apk/guitar-coach-ai-v14.apk
          retention-days: 30
          if-no-files-found: error
      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/one-time-live-feedback-song-coach-v14.yml
          rm -f .github/workflows/one-time-pr-live-feedback-song-coach-v14.yml
          rm -f .github/workflows/one-time-trigger-live-feedback-v14.yml
          rm -rf mobile/android mobile/.quality-dist mobile/node_modules
          git config user.name 'guitar-coach-ci'
          git config user.email 'guitar-coach-ci@users.noreply.github.com'
          git add mobile .github/workflows
          git commit -m 'Connect live posture feedback and song studio coaching'
          git push origin HEAD:agent/live-coach-compat-v055
