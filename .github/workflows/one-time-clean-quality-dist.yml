name: One-time clean generated quality output

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.ref == 'agent/live-coach-compat-v055'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - name: Remove generated quality output only
        shell: bash
        run: |
          set -euo pipefail
          test -d mobile/.quality-dist
          git rm -r mobile/.quality-dist
          git rm .github/workflows/one-time-clean-quality-dist.yml
          git config user.name "guitar-coach-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove generated quality test output"
          git push origin HEAD:agent/live-coach-compat-v055
