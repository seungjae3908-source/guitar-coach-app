name: One-time clean quality output

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/live-coach-compat-v055'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove generated quality output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/.quality-dist
          if ! grep -qxF 'mobile/.quality-dist/' .gitignore; then
            printf '\n# Generated TypeScript quality-test output\nmobile/.quality-dist/\n' >> .gitignore
          fi
          rm -f .github/workflows/one-time-clean-quality-output.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "OpenAI Engineering"
          git config user.email "engineering@openai.invalid"
          git add -A
          git diff --cached --check
          git commit -m "Remove generated quality test output"
          git push origin HEAD:agent/live-coach-compat-v055
