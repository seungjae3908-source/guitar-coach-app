name: One-time final v25 APK

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  build-final:
    if: github.event.pull_request.head.ref == 'agent/live-coach-compat-v055'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Normalize visible v25 labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('mobile/CompleteBetaAppV060Plus.tsx'): [
                  ('GUITAR COACH AI 0.6.0 · v24', 'GUITAR COACH AI 0.6.0 · v25'),
                  ("0.6.0 v24 · {mode === 'acoustic'", "0.6.0 v25 · {mode === 'acoustic'"),
              ],
              Path('mobile/components/PracticeSessionRunnerV8.tsx'): [
                  ('FOCUS V9 · v24 · 마이크 OFF', 'FOCUS LIVE · v25 · 마이크 OFF'),
                  ('notes: `FOCUS V9 · 캡처', 'notes: `FOCUS LIVE v25 · 캡처'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing label in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-final-v25-apk.yml

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run typecheck and quality suite
        working-directory: mobile
        run: npm run typecheck

      - name: Commit final source labels
        shell: bash
        run: |
          git config user.name "OpenAI Engineering"
          git config user.email "engineering@openai.invalid"
          git add -A
          git diff --cached --check
          git commit -m "Finalize live local recognition v25 labels"
          git push origin HEAD:agent/live-coach-compat-v055

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: 1
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build and verify final ARM64 APK
        working-directory: mobile/android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          build_tools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          tools="$ANDROID_HOME/build-tools/$build_tools"
          release_dir='app/build/outputs/apk/release'
          final_dir='app/build/outputs/apk/final'
          mkdir -p "$final_dir"
          output="$final_dir/guitar-coach-live-local-voice-v25-final.apk"
          signed=$(find "$release_dir" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -n 1 || true)
          unsigned=$(find "$release_dir" -maxdepth 1 -type f -name '*unsigned.apk' | head -n 1 || true)
          if [ -n "$signed" ]; then
            cp "$signed" "$output"
          elif [ -n "$unsigned" ]; then
            "$tools/zipalign" -f 4 "$unsigned" /tmp/guitar-coach-v25-final-aligned.apk
            "$tools/apksigner" sign --ks app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$output" /tmp/guitar-coach-v25-final-aligned.apk
          else
            echo 'Release APK was not generated.'
            exit 1
          fi
          "$tools/apksigner" verify --verbose --print-certs "$output"
          test -s "$output"
          size=$(stat -c%s "$output")
          test "$size" -gt 1000000
          test "$size" -lt 110000000
          unzip -l "$output" | grep -q 'assets/hand_landmarker.task'
          unzip -l "$output" | grep -q 'assets/efficientnet_lite0.tflite'
          sha256sum "$output" | tee "$final_dir/SHA256SUMS.txt"
          echo "Final APK size: $size bytes"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: guitar-coach-live-local-voice-v25-final
          path: |
            mobile/android/app/build/outputs/apk/final/guitar-coach-live-local-voice-v25-final.apk
            mobile/android/app/build/outputs/apk/final/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
