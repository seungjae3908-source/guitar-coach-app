name: Build Guitar Training OS v2 APK

on:
  push:
    branches:
      - build/guitar-tempo-coach-v1-apk-clean
    paths:
      - '.github/workflows/apk-guitar-v200.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct verified v1.3 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tempo-coach-v1/.bundle/repair00a.txt \
            tempo-coach-v1/.bundle/repair00b.txt \
            tempo-coach-v1/.bundle/chunk01.txt \
            tempo-coach-v1/.bundle/chunk02.txt \
            tempo-coach-v1/.bundle/repair03a.txt \
            tempo-coach-v1/.bundle/repair03b.txt \
            tempo-coach-v1/.bundle/chunk04.txt \
            tempo-coach-v1/.bundle/chunk05.txt \
            tempo-coach-v1/.bundle/chunk06.txt \
            tempo-coach-v1/.bundle/chunk07.txt \
            tempo-coach-v1/.bundle/chunk08.txt \
            tempo-coach-v1/.bundle/chunk09.txt \
            tempo-coach-v1/.bundle/chunk10.txt \
            tempo-coach-v1/.bundle/chunk11.txt \
            tempo-coach-v1/.bundle/chunk12.txt > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          echo 'cbed50f6cfbffa73f2a60ba38ef951ae77c523d83d0f6812e0c2524694ea6e78  /tmp/base.zip' | sha256sum -c -
          rm -rf mobile && mkdir mobile
          unzip -q /tmp/base.zip -d mobile

          : > /tmp/v110.b64
          for i in $(seq -w 0 10); do cat "tempo-coach-v1/.patch_v110/patch${i}.txt" >> /tmp/v110.b64; done
          base64 --decode /tmp/v110.b64 > /tmp/v110.gz
          echo '85cd542a2d1dd092d0bb2d360cca9bbb2a415e3c3ad1d8f8e8576661d0d4ffb2  /tmp/v110.gz' | sha256sum -c -
          gzip -dc /tmp/v110.gz > /tmp/v110.patch
          patch -p1 -d mobile < /tmp/v110.patch

          : > /tmp/v120.b64
          for i in {00..03}; do cat "tempo-coach-v1/.patch_v120/patch${i}.txt" >> /tmp/v120.b64; done
          base64 --decode /tmp/v120.b64 > /tmp/v120.gz
          echo '6c6bfa89db89254192d03210b0766b95a1b4fc958edbe5fc7a4ce0a67304bc8c  /tmp/v120.gz' | sha256sum -c -
          gzip -dc /tmp/v120.gz > /tmp/v120.patch
          echo '949bc878f720704fd403b42e9611293191b243287ce0e09a1d10e70389c8b964  /tmp/v120.patch' | sha256sum -c -
          patch -p1 -d mobile < /tmp/v120.patch
          base64 --decode tempo-coach-v1/.patch_v120/typefix.gz.b64 > /tmp/v120-typefix.gz
          echo '803af490fe90a7b1d61f95cdcda3e26966a7c0fc2b552610e6b1f48207645c50  /tmp/v120-typefix.gz' | sha256sum -c -
          gzip -dc /tmp/v120-typefix.gz > /tmp/v120-typefix.patch
          patch -p1 -d mobile < /tmp/v120-typefix.patch

          cat \
            tempo-coach-v1/.patch_v130/patch00.txt \
            tempo-coach-v1/.patch_v130/patch01.txt \
            tempo-coach-v1/.patch_v130/patch02.txt \
            tempo-coach-v1/.patch_v130/patch03.txt \
            tempo-coach-v1/.patch_v130/repair04a.txt \
            tempo-coach-v1/.patch_v130/repair04b.txt \
            tempo-coach-v1/.patch_v130/patch05.txt \
            tempo-coach-v1/.patch_v130/patch06.txt \
            tempo-coach-v1/.patch_v130/patch07.txt \
            tempo-coach-v1/.patch_v130/patch08.txt > /tmp/v130.b64
          base64 --decode /tmp/v130.b64 > /tmp/v130.gz
          echo '6c2d8af475fbd615dace3bb6464508297918385236cf2497a07bb3f4095fb9f4  /tmp/v130.gz' | sha256sum -c -
          gzip -dc /tmp/v130.gz > /tmp/v130.patch
          echo 'e73a74a3350358a7f438f4cf37d3116b44ce40cfeafd963bf67396bdaa96bda6  /tmp/v130.patch' | sha256sum -c -
          patch -p1 -d mobile < /tmp/v130.patch
          base64 --decode tempo-coach-v1/.patch_v130/typefix.gz.b64 > /tmp/v130-typefix.gz
          echo '41950d2c4596f474071f1595eeb4c755fba0ed3decc820d95c748c846c5ae966  /tmp/v130-typefix.gz' | sha256sum -c -
          gzip -dc /tmp/v130-typefix.gz > /tmp/v130-typefix.patch
          echo '038d5d3ea661365dfe0d37c1773d8efc840fe3675b5a92020ac1d301c7e6b96e  /tmp/v130-typefix.patch' | sha256sum -c -
          patch -p1 -d mobile < /tmp/v130-typefix.patch
          test "$(node -p "require('./mobile/package.json').version")" = '1.3.0'

      - name: Apply verified v2.0 Training OS patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v200.b64
          for i in {00..17}; do cat "tempo-coach-v1/.patch_v200/patch${i}.txt" >> /tmp/v200.b64; done
          base64 --decode /tmp/v200.b64 > /tmp/v200.patch.gz
          echo 'c2c954e17cd545f21f6e2fb681c4d30869ab5db02ee27cea7619b5d19fe50e04  /tmp/v200.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v200.patch.gz > /tmp/v200.patch
          echo '3fe71c9d83fe61c3479cd96a79604ced7f13bddbd6fc8ac4cf1a02ed706591b9  /tmp/v200.patch' | sha256sum -c -
          patch -p1 -d mobile < /tmp/v200.patch

          test "$(node -p "require('./mobile/package.json').version")" = '2.0.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.0.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '6'
          if grep -R -F 'ScrollView' mobile/src/screens; then echo 'ScrollView remains in a main screen'; exit 1; fi
          grep -F 'PRACTICE OS 2.0' mobile/src/screens/PracticeScreen.tsx
          grep -F 'GUITAR TRAINING OS 2.0' mobile/src/screens/HomeScreen.tsx
          grep -F 'judgeReliability' mobile/src/domain/performanceJudge.ts
          grep -F 'weakLoopFromSession' mobile/src/domain/trainingOS.ts
          grep -F 'makeLoopExercise' mobile/src/domain/playback.ts
          grep -F "export type BlindMode = 'FULL' | 'FADE' | 'MEMORY';" mobile/src/types.ts
          grep -F 'GrooveStyle' mobile/src/hooks/useMetronome.ts
          grep -F 'Metal' mobile/src/screens/MetronomeScreen.tsx
          grep -F 'NO SCORE' mobile/src/screens/PracticeScreen.tsx
          grep -F '마이크 신뢰도가 부족해 점수를 확정하지 않았습니다.' mobile/src/screens/PracticeScreen.tsx

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect, sign and verify v2 APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$BUILD_TOOLS"
          RELEASE_DIR='mobile/android/app/build/outputs/apk/release'
          OUTPUT='GuitarTempoCoach-v2.0.0-release.apk'
          SIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -1 || true)"
          UNSIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*unsigned.apk' | head -1 || true)"
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUTPUT"
          elif [ -n "$UNSIGNED" ]; then
            test -s mobile/android/app/debug.keystore
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" /tmp/GuitarTempoCoach-v200-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks mobile/android/app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT" \
              /tmp/GuitarTempoCoach-v200-aligned.apk
          else
            echo 'Release APK was not generated'; exit 1
          fi
          test -s "$OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'assets/index.android.bundle'
          BUNDLE_BYTES="$(unzip -p "$OUTPUT" assets/index.android.bundle | wc -c)"
          echo "Embedded JS bundle bytes: $BUNDLE_BYTES"
          test "$BUNDLE_BYTES" -gt 10000
          unzip -t "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -lh "$OUTPUT"

      - name: Upload v2 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.0.0-release-apk
          path: |
            GuitarTempoCoach-v2.0.0-release.apk
            GuitarTempoCoach-v2.0.0-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
