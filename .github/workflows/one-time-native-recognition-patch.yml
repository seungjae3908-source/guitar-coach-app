name: Apply guarded native recognition patch

on:
  push:
    branches:
      - agent/live-coach-compat-v055
    paths:
      - .github/workflows/one-time-native-recognition-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - name: Apply exact native recognition replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachContinuousCameraModule.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  private var lastStringRefreshFrame = 0L\n  private val previousContacts = mutableMapOf<String, PreviousContact>()',
                  '  private var lastStringRefreshFrame = 0L\n  private var consecutiveStringMisses = 0\n  private val previousContacts = mutableMapOf<String, PreviousContact>()',
              ),
              (
                  '    lastStringRefreshFrame = 0\n    previousContacts.clear()',
                  '    lastStringRefreshFrame = 0\n    consecutiveStringMisses = 0\n    previousContacts.clear()',
              ),
              (
                  '''      val hand = lastHandResult\n\n      val shouldRefreshStrings = lastStringState == null || frameCount - lastStringRefreshFrame >= 3L\n      if (shouldRefreshStrings) {\n        val detected = detectStrings(bitmap, hand)\n        if (detected != null) lastStringState = stabilizeStrings(lastStringState, detected)\n        lastStringRefreshFrame = frameCount\n      }''',
                  '''      val hand = lastHandResult\n      if (hand?.hasHand != true) previousContacts.clear()\n\n      val shouldRefreshStrings = lastStringState == null || frameCount - lastStringRefreshFrame >= 3L\n      if (shouldRefreshStrings) {\n        val detected = detectStrings(bitmap, hand)\n        if (detected != null) {\n          lastStringState = stabilizeStrings(lastStringState, detected)\n          lastStringRefreshFrame = frameCount\n          consecutiveStringMisses = 0\n        } else {\n          consecutiveStringMisses += 1\n          if (consecutiveStringMisses >= 2) {\n            lastStringState = null\n            previousContacts.clear()\n          }\n        }\n      }''',
              ),
              (
                  '    val minimum = max(10, (areaSamples * 0.011).roundToInt())',
                  '    val minimum = max(7, (areaSamples * 0.004).roundToInt())',
              ),
              (
                  '    "green" -> hue in 75f..170f && saturation >= 0.35f && value >= 0.22f',
                  '    "green" -> hue in 55f..180f && saturation >= 0.10f && value >= 0.30f',
              ),
              (
                  '    "auto" -> saturation >= 0.50f && value >= 0.22f && hue in 42f..338f',
                  '    "auto" -> saturation >= 0.10f && value >= 0.30f && hue in 55f..335f',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one native match, found {count}: {old[:90]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit native recognition patch
        run: |
          if git diff --quiet; then
            echo "No patch produced"
            exit 1
          fi
          git config user.name "guitar-coach-quality-bot"
          git config user.email "guitar-coach-quality-bot@users.noreply.github.com"
          git add mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachContinuousCameraModule.kt
          git commit -m "Improve real-video pick detection and expire stale strings"
          git push origin HEAD:agent/live-coach-compat-v055
