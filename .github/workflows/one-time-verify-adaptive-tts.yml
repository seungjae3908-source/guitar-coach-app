name: Verify adaptive TTS timing and wording

on:
  push:
    branches:
      - agent/live-coach-compat-v055

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'guitar-coach-quality-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-coach-compat-v055
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify adaptive fields and correct wording
        run: |
          python - <<'PY'
          from pathlib import Path

          native = Path('mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachMetronomeModule.kt')
          text = native.read_text(encoding='utf-8')
          required = [
              'UtteranceProgressListener',
              'voiceOnsetLatencyAverageMs',
              'voiceOnsetOffsetAverageMs',
              'voiceOnsetSamples',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'adaptive TTS patch missing: {missing}')
          text = text.replace(
              '사람 음성 준비 완료 · 실제 발음 시작 자동 보정',
              '사람 음성 준비 완료 · TTS 엔진 시작 지연 자동 보정',
          )
          old = '''              val builder = AudioTrack.Builder()
                .setAudioAttributes(attributes)
                .setAudioFormat(format)
                .setTransferMode(AudioTrack.MODE_STATIC)
                .setBufferSizeInBytes(samples.size * 2)'''
          new = '''              val minimumBuffer = AudioTrack.getMinBufferSize(
                SAMPLE_RATE,
                AudioFormat.CHANNEL_OUT_MONO,
                AudioFormat.ENCODING_PCM_16BIT
              ).coerceAtLeast(samples.size * 2)
              val builder = AudioTrack.Builder()
                .setAudioAttributes(attributes)
                .setAudioFormat(format)
                .setTransferMode(AudioTrack.MODE_STATIC)
                .setBufferSizeInBytes(max(samples.size * 2, minimumBuffer))'''
          if old not in text:
              raise SystemExit('AudioTrack buffer marker missing')
          native.write_text(text.replace(old, new, 1), encoding='utf-8')

          panel = Path('mobile/components/MetronomeProgramPanel.tsx')
          text = panel.read_text(encoding='utf-8')
          required_panel = ['voiceOnsetLatencyAverageMs', 'voiceOnsetOffsetAverageMs', 'voiceOnsetSamples']
          missing_panel = [value for value in required_panel if value not in text]
          if missing_panel:
              raise SystemExit(f'adaptive timing UI missing: {missing_panel}')
          text = text.replace(
              '음성 실제 시작 지연',
              'TTS 엔진 시작 지연',
          ).replace(
              '음성 카운트는 다음 박보다 미리 요청해 발음 시작 지연을 보정합니다.',
              '음성 카운트는 다음 박보다 미리 요청하고 TTS 엔진 시작 콜백 지연을 보정합니다. 스피커 출력 시각은 삼성 실기 검수에서 별도로 확인합니다.',
          )
          panel.write_text(text, encoding='utf-8')
          PY

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run TypeScript and executable quality gates
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile release Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Commit verified wording and buffer hardening
        run: |
          rm -f .github/workflows/one-time-verify-adaptive-tts.yml .github/verify-adaptive-tts-trigger.txt
          git config user.name "guitar-coach-quality-bot"
          git config user.email "guitar-coach-quality-bot@users.noreply.github.com"
          git add mobile/modules/guitar-coach-native/android/src/main/java/expo/modules/guitarcoachnative/GuitarCoachMetronomeModule.kt mobile/components/MetronomeProgramPanel.tsx .github/workflows/one-time-verify-adaptive-tts.yml .github/verify-adaptive-tts-trigger.txt
          git commit -m "Verify adaptive TTS timing and audio buffer"
          git push origin HEAD:agent/live-coach-compat-v055
