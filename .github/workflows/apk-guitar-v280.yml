name: Build Guitar Training OS v2.8 Reference Tone Capture APK

on:
  push:
    branches:
      - build/guitar-training-os-v280-reference-tone-capture
    paths:
      - '.github/workflows/apk-guitar-v280.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified v2.7 reconstructed source
        uses: actions/download-artifact@v4
        with:
          name: GuitarTempoCoach-v2.7.0-source-reconstructed
          path: baseline
          github-token: ${{ github.token }}
          repository: seungjae3908-source/guitar-coach-app
          run-id: 35194831069

      - name: Restore verified v2.7 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile
          mkdir mobile
          unzip -q baseline/GuitarTempoCoach-v2.7.0-source-reconstructed.zip -d mobile
          test "$(node -p "require('./mobile/package.json').version")" = '2.7.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.7.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '13'

      - name: Reassemble and verify exact v2.8 patch
        shell: bash
        run: |
          set -euo pipefail
          cat tempo-coach-v1/.patch_v280/chunks/patch{00..11}.txt > /tmp/v280.b64
          test "$(wc -c < /tmp/v280.b64)" -eq 17848
          echo '39a4dfbd4ca52b6b7f389611cf536da954a540c564c2034504b6cb81bf961526  /tmp/v280.b64' | sha256sum -c -
          base64 --decode /tmp/v280.b64 > /tmp/v280.patch.gz
          test "$(wc -c < /tmp/v280.patch.gz)" -eq 13384
          echo 'dca2103c6491e00a1eb4b43555240fe4348e4f4c3b24de665969a4a0775433e7  /tmp/v280.patch.gz' | sha256sum -c -
          gzip -t /tmp/v280.patch.gz
          gzip -dc /tmp/v280.patch.gz > /tmp/v280.patch
          test "$(wc -c < /tmp/v280.patch)" -eq 58170
          echo '55df38927a16862daa35bc113adaf3964b8f071663d9ac88cc389d55bb05fe00  /tmp/v280.patch' | sha256sum -c -

      - name: Apply v2.8 patch
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < /tmp/v280.patch
          test "$(node -p "require('./mobile/package.json').version")" = '2.8.0'
          test "$(node -p "require('./mobile/app.json').expo.version")" = '2.8.0'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '14'

      - name: Verify v2.8 product contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F 'ScrollView' mobile/src/screens; then
            echo 'ScrollView remains in a main screen'; exit 1
          fi
          grep -F 'GUITAR TRAINING OS 2.8' mobile/src/screens/HomeScreen.tsx
          grep -F 'PRACTICE OS 2.8' mobile/src/screens/PracticeScreen.tsx
          grep -F 'STUDIO 2.8' mobile/src/screens/AnalyzerScreen.tsx
          grep -F 'SONG LAB 2.8' mobile/src/screens/SongLabScreen.tsx
          grep -F 'REFERENCE TONE CAPTURE · BOSS GT-1 + THR-II' mobile/src/screens/SongLabScreen.tsx
          grep -F 'useAudioSampleListener' mobile/src/screens/SongLabScreen.tsx
          grep -F 'requestRecordingPermissionsAsync' mobile/src/screens/SongLabScreen.tsx
          grep -F '공식 8초 분석' mobile/src/screens/SongLabScreen.tsx
          grep -F '오디오 파일' mobile/src/screens/SongLabScreen.tsx
          grep -F 'A · 원본' mobile/src/screens/SongLabScreen.tsx
          grep -F 'B · 내 톤' mobile/src/screens/SongLabScreen.tsx
          grep -F "label:'공간−'" mobile/src/screens/SongLabScreen.tsx
          grep -F 'createReferenceToneAccumulator' mobile/src/domain/referenceTone.ts
          grep -F 'finalizeReferenceToneCapture' mobile/src/domain/referenceTone.ts
          grep -F 'buildReferenceToneRecipe' mobile/src/domain/referenceTone.ts
          grep -F "sourceCap = sourceKind === 'local-audio' ? 86 : 70" mobile/src/domain/referenceTone.ts
          grep -F 'No raw audio is retained' mobile/src/domain/referenceTone.ts

      - name: Package v2.8 source baseline
        shell: bash
        run: |
          set -euo pipefail
          (cd mobile && zip -qr ../GuitarTempoCoach-v2.8.0-source.zip .)
          test -s GuitarTempoCoach-v2.8.0-source.zip
          sha256sum GuitarTempoCoach-v2.8.0-source.zip > GuitarTempoCoach-v2.8.0-source.zip.sha256

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone ARM64 release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect, sign and verify v2.8 APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$BUILD_TOOLS"
          RELEASE_DIR='mobile/android/app/build/outputs/apk/release'
          OUTPUT='GuitarTempoCoach-v2.8.0-release.apk'
          SIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*release.apk' ! -name '*unsigned*' | head -1 || true)"
          UNSIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*unsigned.apk' | head -1 || true)"
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUTPUT"
          elif [ -n "$UNSIGNED" ]; then
            test -s mobile/android/app/debug.keystore
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" /tmp/GuitarTempoCoach-v280-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks mobile/android/app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT" \
              /tmp/GuitarTempoCoach-v280-aligned.apk
          else
            echo 'Release APK was not generated'; exit 1
          fi
          test -s "$OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'assets/index.android.bundle'
          BUNDLE_BYTES="$(unzip -p "$OUTPUT" assets/index.android.bundle | wc -c)"
          echo "Embedded JS bundle bytes: $BUNDLE_BYTES"
          test "$BUNDLE_BYTES" -gt 10000
          unzip -t "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -lh "$OUTPUT"

      - name: Upload v2.8 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.8.0-release-apk
          path: |
            GuitarTempoCoach-v2.8.0-release.apk
            GuitarTempoCoach-v2.8.0-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload v2.8 source artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTempoCoach-v2.8.0-source
          path: |
            GuitarTempoCoach-v2.8.0-source.zip
            GuitarTempoCoach-v2.8.0-source.zip.sha256
          if-no-files-found: error
          retention-days: 30
